
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跨设备日历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 12px;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .controls {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-group label {
            font-weight: 600;
            color: #333;
            min-width: 70px;
            font-size: 13px;
        }
        
        input[type="text"], input[type="password"], select {
            padding: 6px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: border-color 0.3s;
            flex: 1;
            min-width: 120px;
            max-width: 100%
            font-family: inherit;
        }
        
        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(17, 153, 142, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .year-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
        }
        
        .year-selector label {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        
        .year-selector select {
            min-width: 100px;
            background: white;
        }
        
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
            justify-content: center;
        }
        
        .month-tab {
            padding: 6px 12px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
        }
        
        .month-tab:hover {
            background: rgba(255,255,255,0.5);
        }
        
        .month-tab.active {
            background: white;
            color: #667eea;
            border-color: white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .calendar-wrapper {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .calendar-header h2 {
            color: #333;
            font-size: 1.2rem;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }
        
        .weekday {
            text-align: center;
            font-weight: 700;
            color: #667eea;
            padding: 6px 2px;
            font-size: 12px;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        
        .day-cell {
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            background: white;
            min-height: 60px;
            display: flex;
            flex-direction: column;
        }
        
        .day-cell:hover {
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(102, 126, 234, 0.2);
        }
        
        .day-cell.today {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        
        .day-cell.other-month {
            opacity: 0.35;
        }
        
        .day-number {
            font-weight: 700;
            color: #333;
            font-size: 13px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }
        
        .day-cell.today .day-number {
            color: #667eea;
        }
        
        .day-content {
            font-size: 11px;
            color: #555;
            line-height: 1.3;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            flex: 1;
        }
        
        .day-cell.has-content {
            border-color: #38ef7d;
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.05) 0%, rgba(17, 153, 142, 0.05) 100%);
        }
        
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .edit-modal.active {
            display: flex;
        }
        
        .edit-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .edit-box h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }
        
        .edit-box textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.3s;
            line-height: 1.5;
        }
        
        .edit-box textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .edit-box .hint {
            color: #999;
            font-size: 13px;
            margin-top: 8px;
        }
        
        .toast {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.4s ease;
            z-index: 2000;
            font-size: 14px;
            max-width: 300px;
            word-break: break-word;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .toast.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        
        .hidden-file-input {
            display: none;
        }
        
        /* ========== 移动端竖屏适配 ========== */
        @media (max-width: 480px) and (orientation: portrait) {
            body {
                padding: 8px;
            }
            
            h1 {
                font-size: 1.2rem;
                margin-bottom: 8px;
            }
            
            .controls {
                padding: 10px;
                margin-bottom: 8px;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                margin-bottom: 8px;
            }
            
            .control-group label {
                min-width: auto;
            }
            
            input[type="text"], input[type="password"], select {
                min-width: 100%;
                font-size: 16px;
            }
            
            button {
                font-size: 13px;
                padding: 8px 10px;
                flex: 1;
            }
            
            .year-selector {
                margin-bottom: 8px;
            }
            
            .month-tabs {
                gap: 3px;
                margin-bottom: 8px;
            }
            
            .month-tab {
                padding: 4px 8px;
                font-size: 11px;
                border-radius: 14px;
            }
            
            .calendar-wrapper {
                padding: 8px;
            }
            
            .calendar-header h2 {
                font-size: 1rem;
            }
            
            .weekdays {
                gap: 2px;
                margin-bottom: 4px;
            }
            
            .weekday {
                padding: 4px 1px;
                font-size: 11px;
            }
            
            .days-grid {
                gap: 2px;
            }
            
            .day-cell {
                min-height: 48px;
                padding: 3px;
                border-radius: 6px;
            }
            
            .day-number {
                font-size: 11px;
            }
            
            .day-content {
                font-size: 9px;
                line-height: 1.2;
                -webkit-line-clamp: 2;
            }
            
            .edit-box {
                padding: 16px;
                width: 92%;
            }
            
            .edit-box textarea {
                font-size: 16px;
                min-height: 100px;
            }
        }
        
        @media (max-width: 360px) and (orientation: portrait) {
            .day-cell {
                min-height: 42px;
                padding: 2px;
            }
            
            .day-number {
                font-size: 10px;
            }
            
            .day-content {
                font-size: 8px;
                -webkit-line-clamp: 2;
            }
            
            .month-tab {
                padding: 3px 6px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 跨设备日历</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>GitHub Token:</label>
                <input type="password" id="githubToken" placeholder="输入 GitHub Personal Access Token">
            </div>
            <div class="control-group">
                <label>Gist ID:</label>
                <input type="text" id="gistId" placeholder="输入 Gist ID（留空则新建）">
            </div>
            <div class="control-group">
                <button class="btn-primary" onclick="uploadToGist()">☁️ 上传到 Gist</button>
                <button class="btn-success" onclick="downloadFromGist()">📥 从 Gist 下载</button>
                <button class="btn-secondary" onclick="exportJSON()">📤 导出 JSON</button>
                <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 导入 JSON</button>
                <input type="file" id="fileInput" class="hidden-file-input" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
        
        <div class="year-selector">
            <label for="yearSelect">📆 年份:</label>
            <select id="yearSelect" onchange="changeYear(this.value)"></select>
        </div>
        
        <div class="month-tabs" id="monthTabs"></div>
        
        <div class="calendar-wrapper">
            <div class="calendar-header">
                <h2 id="currentMonthYear"></h2>
            </div>
            <div class="weekdays">
                <div class="weekday">日</div>
                <div class="weekday">一</div>
                <div class="weekday">二</div>
                <div class="weekday">三</div>
                <div class="weekday">四</div>
                <div class="weekday">五</div>
                <div class="weekday">六</div>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>
    
    <div class="edit-modal" id="editModal" onclick="closeEditModal(event)">
        <div class="edit-box" onclick="event.stopPropagation()">
            <h3 id="editTitle">编辑日程</h3>
            <textarea id="editTextarea" placeholder="在此输入您的日程安排..."></textarea>
            <p class="hint">点击空白处或按 ESC 键保存并关闭</p>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // 数据存储
        let calendarData = {};
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let editingDate = null;
        
        const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
        
        // ========== 本地存储封装 ==========
        const Storage = {
            get(key, defaultVal) {
                try {
                    const val = localStorage.getItem(key);
                    return val !== null ? JSON.parse(val) : defaultVal;
                } catch (e) {
                    return defaultVal;
                }
            },
            set(key, val) {
                localStorage.setItem(key, JSON.stringify(val));
            }
        };
        
        // 初始化
        function init() {
            loadSettings();
            loadCalendarData();
            initYearSelector();
            renderMonthTabs();
            renderCalendar();
            setupKeyboardEvents();
            setupAutoSave();
        }
        
        // 加载设置（Token/Gist）
        function loadSettings() {
            const token = Storage.get('githubToken', '');
            const gistId = Storage.get('gistId', '');
            document.getElementById('githubToken').value = token;
            document.getElementById('gistId').value = gistId;
        }
        
        // 保存设置
        function saveSettings() {
            Storage.set('githubToken', document.getElementById('githubToken').value);
            Storage.set('gistId', document.getElementById('gistId').value);
        }
        
        // 自动保存监听
        function setupAutoSave() {
            document.getElementById('githubToken').addEventListener('input', debounce(saveSettings, 500));
            document.getElementById('gistId').addEventListener('input', debounce(saveSettings, 500));
        }
        
        function debounce(fn, ms) {
            let timer;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, arguments), ms);
            };
        }
        
        // 加载日历数据
        function loadCalendarData() {
            calendarData = Storage.get('calendarData', {});
            if (typeof calendarData !== 'object' || calendarData === null || Array.isArray(calendarData)) {
                calendarData = {};
            }
        }
        
        // 保存日历数据
        function saveCalendarData() {
            Storage.set('calendarData', calendarData);
        }
        
        // 初始化年份选择器：当前年到当前年+30
        function initYearSelector() {
            const select = document.getElementById('yearSelect');
            const currentY = new Date().getFullYear();
            const endYear = currentY + 30;
            
            for (let y = currentY; y <= endYear; y++) {
                const option = document.createElement('option');
                option.value = y;
                option.textContent = y + '年';
                if (y === currentYear) option.selected = true;
                select.appendChild(option);
            }
        }
        
        // 切换年份
        function changeYear(year) {
            currentYear = parseInt(year);
            renderCalendar();
        }
        
        // 渲染月份标签
        function renderMonthTabs() {
            const tabsContainer = document.getElementById('monthTabs');
            tabsContainer.innerHTML = '';
            
            for (let i = 0; i < 12; i++) {
                const tab = document.createElement('button');
                tab.className = 'month-tab' + (i === currentMonth ? ' active' : '');
                tab.textContent = monthNames[i];
                tab.onclick = () => switchMonth(i);
                tabsContainer.appendChild(tab);
            }
        }
        
        // 切换月份
        function switchMonth(month) {
            currentMonth = month;
            renderMonthTabs();
            renderCalendar();
        }
        
        // 渲染日历
        function renderCalendar() {
            const year = currentYear;
            const month = currentMonth;
            
            document.getElementById('currentMonthYear').textContent = `${year}年 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDay = firstDay.getDay();
            
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';
            
            // 上月填充
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startingDay - 1; i >= 0; i--) {
                const dayCell = createDayCell(year, month - 1, prevMonthLastDay - i, true);
                daysGrid.appendChild(dayCell);
            }
            
            // 当月
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const dayCell = createDayCell(year, month, day, false, isToday);
                daysGrid.appendChild(dayCell);
            }
            
            // 下月填充
            const totalCells = startingDay + daysInMonth;
            const rows = Math.ceil(totalCells / 7);
            const targetCells = rows * 7;
            const remainingCells = targetCells - totalCells;
            
            for (let day = 1; day <= remainingCells; day++) {
                const dayCell = createDayCell(year, month + 1, day, true);
                daysGrid.appendChild(dayCell);
            }
        }
        
        // 创建日期单元格
        function createDayCell(year, month, day, isOtherMonth, isToday = false) {
            const dateKey = getDateKey(year, month, day);
            
            let content = calendarData[dateKey];
            if (typeof content !== 'string') {
                content = '';
            }
            
            const cell = document.createElement('div');
            cell.className = 'day-cell' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + (content ? ' has-content' : '');
            cell.onclick = () => openEditModal(year, month, day);
            
            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            
            const dayContent = document.createElement('div');
            dayContent.className = 'day-content';
            dayContent.textContent = content;
            
            cell.appendChild(dayNumber);
            cell.appendChild(dayContent);
            
            return cell;
        }
        
        // 获取日期键
        function getDateKey(year, month, day) {
            const date = new Date(year, month, day);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        
        // 打开编辑框
        function openEditModal(year, month, day) {
            editingDate = getDateKey(year, month, day);
            let content = calendarData[editingDate];
            if (typeof content !== 'string') content = '';
            
            document.getElementById('editTitle').textContent = `${editingDate} 的日程`;
            document.getElementById('editTextarea').value = content;
            document.getElementById('editModal').classList.add('active');
            document.getElementById('editTextarea').focus();
        }
        
        // 关闭编辑框
        function closeEditModal(event) {
            if (event && event.target !== document.getElementById('editModal')) return;
            
            if (editingDate) {
                const content = document.getElementById('editTextarea').value.trim();
                if (content) {
                    calendarData[editingDate] = content;
                } else {
                    delete calendarData[editingDate];
                }
                saveCalendarData();
                renderCalendar();
                editingDate = null;
            }
            
            document.getElementById('editModal').classList.remove('active');
        }
        
        // 键盘事件
        function setupKeyboardEvents() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeEditModal();
                }
            });
        }
        
        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 上传到 Gist：有 ID 则更新，无 ID 则新建
        async function uploadToGist() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showToast('请输入 GitHub Token', 'error');
                return;
            }
            
            const gistId = document.getElementById('gistId').value.trim();
            const payload = {
                description: '跨设备日历数据',
                public: false,
                files: {
                    'calendar-data.json': {
                        content: JSON.stringify(calendarData, null, 2)
                    }
                }
            };
            
            try {
                let response;
                if (gistId) {
                    // 更新已有 Gist
                    response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // 新建 Gist
                    response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                }
                
                if (!response.ok) {
                    throw new Error((gistId ? '更新' : '上传') + '失败: ' + response.statusText);
                }
                
                const data = await response.json();
                
                // 如果是新建，保存 Gist ID
                if (!gistId) {
                    document.getElementById('gistId').value = data.id;
                    saveSettings();
                    showToast('✅ 新建 Gist 成功！ID: ' + data.id);
                } else {
                    showToast('✅ 更新 Gist 成功！');
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }
        
        // 从 Gist 下载
        async function downloadFromGist() {
            const token = document.getElementById('githubToken').value.trim();
            const gistId = document.getElementById('gistId').value.trim();
            
            if (!gistId) {
                showToast('请输入 Gist ID', 'error');
                return;
            }
            
            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = `token ${token}`;
                }
                
                const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: headers
