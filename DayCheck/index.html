<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <base target="_self">
  <title>📅 月签 · 记事日历</title>
  <style>
    /* ===== 全局重置 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 16px;
      margin: 0;
    }

    .calendar-wrapper {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 28px;
      box-sizing: border-box;
    }

    /* ===== 所有尺寸均使用相对单位 ===== */
    .app-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 20px;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-header h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #64748b;
    }

    .year-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .year-nav button {
      background: #f1f4fa;
      border: 1px solid #d1d9e6;
      border-radius: 40px;
      padding: 4px 12px;
      font-size: 1rem;
      cursor: pointer;
      color: #1e293b;
    }

    .year-badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid #d9e2ef;
      min-width: 80px;
      text-align: center;
    }

    /* ===== GitHub 控制区 ===== */
    .github-controls {
      background: #f8fafc;
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      width: 100%;
      box-sizing: border-box;
    }

    .github-controls .field-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1 1 160px;
      min-width: 140px;
    }

    .github-controls label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      min-width: 60px;
    }

    .github-controls input[type="text"],
    .github-controls input[type="password"] {
      flex: 1;
      min-width: 100px;
      padding: 8px 14px;
      border: 1px solid #d1d9e6;
      border-radius: 40px;
      font-size: 0.9rem;
      background: white;
      outline: none;
      box-sizing: border-box;
    }

    .github-controls input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }

    .github-controls .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .btn {
      background: #f1f4fa;
      border: 1px solid #d1d9e6;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1e293b;
      border-color: #1e293b;
      color: white;
    }
    .btn-primary:hover { background: #0f172a; }

    .btn-success {
      background: #16a34a;
      border-color: #16a34a;
      color: white;
    }
    .btn-success:hover { background: #15803d; }

    .btn-outline {
      background: transparent;
      border-color: #cbd5e1;
    }
    .btn-outline:hover { background: #f1f5f9; }

    .btn:active { transform: scale(0.96); }

    /* ===== 月份标签 ===== */
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 4px;
      margin-bottom: 22px;
      border-bottom: 2px solid #e9edf4;
      padding-bottom: 12px;
      width: 100%;
    }

    .month-tab {
      flex: 0 0 auto;
      padding: 8px 18px;
      border-radius: 40px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      background: #f1f4fa;
      transition: all 0.15s;
    }

    .month-tab:hover { background: #e2e8f0; }
    .month-tab.active {
      background: #1e293b;
      color: white;
    }

    /* ===== 日历网格 ===== */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 6px;
      width: 100%;
    }

    .weekday-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-align: center;
      padding: 6px 0 10px 0;
      border-bottom: 1px solid #eef2f6;
      margin-bottom: 4px;
    }

    .day-cell {
      background: #ffffff;
      border-radius: 16px;
      padding: 6px 4px 4px 4px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      border: 1px solid #eef2f6;
      position: relative;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {
      .day-cell {
        min-height: 70px;
        padding: 4px 3px 3px 3px;
        border-radius: 12px;
      }
      .calendar-wrapper { padding: 16px 12px 20px; }
      .month-tab { padding: 6px 12px; font-size: 0.85rem; }
      .app-header h1 { font-size: 1.4rem; }
      .github-controls { flex-direction: column; align-items: stretch; }
      .github-controls .btn-group { margin-left: 0; justify-content: center; }
    }

    .day-number {
      font-size: 0.9rem;
      font-weight: 500;
      color: #0f172a;
      margin-left: 4px;
      margin-bottom: 2px;
      display: inline-block;
      width: fit-content;
      padding: 0 4px;
      border-radius: 8px;
      cursor: pointer;
    }

    .day-cell.other-month .day-number { color: #a3b3cc; font-weight: 400; }

    .day-cell.today {
      background: #f0f4ff;
      border-color: #818cf8;
      box-shadow: 0 0 0 1px #818cf8;
    }
    .day-cell.today .day-number {
      background: #4f46e5;
      color: white;
      padding: 0 8px;
      border-radius: 20px;
    }

    /* ===== 编辑框 ===== */
    .day-note {
      flex: 1;
      border: none;
      background: transparent;
      resize: none;
      font-size: 0.8rem;
      font-family: inherit;
      color: #1e293b;
      padding: 4px 4px 2px 4px;
      margin-top: 2px;
      width: 100%;
      min-height: 40px;
      line-height: 1.4;
      border-radius: 8px;
      outline: none;
      overflow-y: auto;
      cursor: pointer;
      box-sizing: border-box;
    }

    .day-note:focus {
      background: #f8faff;
      box-shadow: inset 0 0 0 2px #c7d2fe;
    }

    .day-note::placeholder {
      color: #b9c7dd;
      font-size: 0.7rem;
      opacity: 0.6;
    }

    /* ===== 放大模式 ===== */
    .day-note.expanded {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 90% !important;
      max-width: 600px !important;
      height: 60vh !important;
      max-height: 400px !important;
      font-size: 1.1rem !important;
      padding: 20px 24px !important;
      background: white !important;
      border-radius: 24px !important;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 4px #818cf8 !important;
      z-index: 1000 !important;
      resize: none !important;
      line-height: 1.8 !important;
      border: none !important;
      outline: none !important;
      overflow-y: auto !important;
    }

    .day-note.expanded::placeholder {
      font-size: 1rem;
      opacity: 0.4;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
    }
    .overlay.active { display: block; }

    .footer-tip {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #eef2f6;
      padding-top: 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 20px;
    }
    .footer-tip span {
      background: #f1f5f9;
      padding: 4px 16px;
      border-radius: 30px;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 0.95rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 999;
      font-weight: 500;
    }
    .toast-message.success { background: #16a34a; }
    .toast-message.error { background: #dc2626; }
    .toast-message.show { opacity: 1; }
  </style>
</head>
<body>

<div class="calendar-wrapper">
  <!-- ===== 头部 ===== -->
  <div class="app-header">
    <h1>📅 月签 <small>· 每日笔记</small></h1>
    <div class="year-nav">
      <button id="prevYearBtn">◀</button>
      <div class="year-badge" id="yearDisplay">2026</div>
      <button id="nextYearBtn">▶</button>
    </div>
  </div>

  <!-- ===== Gist 控制 ===== -->
  <div class="github-controls">
    <div class="field-group">
      <label>🔑 Token</label>
      <input type="password" id="gistTokenInput" placeholder="ghp_xxxxxxxx">
    </div>
    <div class="field-group">
      <label>📌 Gist ID</label>
      <input type="text" id="gistIdInput" placeholder="例如: 3f4a5b6c">
    </div>
    <div class="field-group">
      <label>📄 文件名</label>
      <input type="text" id="gistFilenameInput" value="calendar_notes.json">
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="saveToGistBtn">📤 保存</button>
      <button class="btn btn-success" id="loadFromGistBtn">📥 下载</button>
      <button class="btn btn-outline" id="exportJsonBtn">⬇️ 导出</button>
      <button class="btn btn-outline" id="importJsonBtn">⬆️ 导入</button>
    </div>
  </div>

  <!-- ===== 月份标签 ===== -->
  <div class="tabs-container" id="tabsContainer"></div>

  <!-- ===== 日历网格 ===== -->
  <div class="calendar-grid" id="calendarGrid">
    <div class="weekday-label">一</div>
    <div class="weekday-label">二</div>
    <div class="weekday-label">三</div>
    <div class="weekday-label">四</div>
    <div class="weekday-label">五</div>
    <div class="weekday-label">六</div>
    <div class="weekday-label">日</div>
  </div>

  <div class="footer-tip">
    <span>✏️ 点击日期格放大编辑</span>
    <span>📦 Gist 同步 / JSON 导入导出</span>
  </div>
</div>

<!-- ===== 遮罩 ===== -->
<div class="overlay" id="overlay"></div>
<div id="toastMessage" class="toast-message"></div>

<script>
  (function() {
    'use strict';

    const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let notes = {};
    let expandedTextarea = null;

    const grid = document.getElementById('calendarGrid');
    const tabs = document.getElementById('tabsContainer');
    const yearDisplay = document.getElementById('yearDisplay');
    const overlay = document.getElementById('overlay');
    const toast = document.getElementById('toastMessage');

    const gistToken = document.getElementById('gistTokenInput');
    const gistId = document.getElementById('gistIdInput');
    const gistFile = document.getElementById('gistFilenameInput');

    function fmt(y,m,d) { return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

    function loadStorage() {
      try {
        const s = localStorage.getItem('calendar_notes_v1');
        if (s) { notes = JSON.parse(s); if (typeof notes !== 'object' || Array.isArray(notes)) notes = {}; }
      } catch(e){ notes = {}; }
    }
    function saveStorage() {
      try { localStorage.setItem('calendar_notes_v1', JSON.stringify(notes)); } catch(e){}
    }

    let toastTimer = null;
    function showToast(msg, type='', dur=2200) {
      toast.textContent = msg;
      toast.className = 'toast-message' + (type ? ' '+type : '');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
    }

    // ===== 放大/缩小 =====
    function expand(ta) {
      if (expandedTextarea && expandedTextarea !== ta) collapse(expandedTextarea);
      ta.classList.add('expanded');
      ta.focus();
      expandedTextarea = ta;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      ta.select();
    }

    function collapse(ta) {
      if (!ta) return;
      ta.classList.remove('expanded');
      if (expandedTextarea === ta) expandedTextarea = null;
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      const key = ta.dataset.noteKey;
      if (key) {
        const v = ta.value;
        if (v && v.trim()) notes[key] = v.trim();
        else delete notes[key];
        saveStorage();
      }
    }

    function collapseAll() {
      if (expandedTextarea) collapse(expandedTextarea);
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    overlay.addEventListener('click', collapseAll);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') collapseAll(); });

    // ===== 渲染 =====
    function render(year, month) {
      collapseAll();
      grid.innerHTML = '';
      ['一','二','三','四','五','六','日'].forEach(l => {
        const d = document.createElement('div');
        d.className = 'weekday-label';
        d.textContent = l;
        grid.appendChild(d);
      });

      const first = new Date(year, month, 1);
      let offset = (first.getDay() === 0) ? 6 : first.getDay() - 1;
      const days = new Date(year, month+1, 0).getDate();
      const prevDays = new Date(year, month, 0).getDate();

      const today = new Date();
      const ty = today.getFullYear(), tm = today.getMonth(), td = today.getDate();

      for (let i=0; i<42; i++) {
        let day, other=false, cy=year, cm=month;
        if (i < offset) {
          day = prevDays - offset + i + 1;
          other = true;
          if (month===0) { cy=year-1; cm=11; } else { cy=year; cm=month-1; }
        } else if (i >= offset + days) {
          day = i - (offset + days) + 1;
          other = true;
          if (month===11) { cy=year+1; cm=0; } else { cy=year; cm=month+1; }
        } else {
          day = i - offset + 1;
          cy=year; cm=month;
        }

        const cell = document.createElement('div');
        cell.className = 'day-cell' + (other ? ' other-month' : '');
        if (cy===ty && cm===tm && day===td) cell.classList.add('today');

        const num = document.createElement('span');
        num.className = 'day-number';
        num.textContent = day;
        cell.appendChild(num);

        const key = fmt(cy, cm, day);
        const ta = document.createElement('textarea');
        ta.className = 'day-note';
        ta.placeholder = '点击放大...';
        ta.dataset.noteKey = key;
        if (notes[key]) ta.value = notes[key];

        ta.addEventListener('click', e => {
          e.stopPropagation();
          if (!ta.classList.contains('expanded')) expand(ta);
        });

        ta.addEventListener('input', function() {
          const k = this.dataset.noteKey;
          const v = this.value;
          if (v && v.trim()) notes[k] = v.trim();
          else delete notes[k];
          saveStorage();
        });

        ta.addEventListener('keydown', e => {
          if (e.key === 'Escape' && ta.classList.contains('expanded')) {
            e.preventDefault();
            collapse(ta);
          }
        });

        num.addEventListener('click', e => {
          e.stopPropagation();
          if (!ta.classList.contains('expanded')) expand(ta);
        });

        cell.appendChild(ta);
        grid.appendChild(cell);
      }
      yearDisplay.textContent = year;
    }

    // ===== 月份标签 =====
    function initTabs() {
      tabs.innerHTML = '';
      MONTHS.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'month-tab' + (idx===currentMonth ? ' active' : '');
        btn.textContent = name;
        btn.dataset.idx = idx;
        btn.addEventListener('click', function() {
          collapseAll();
          document.querySelectorAll('.month-tab').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMonth = parseInt(this.dataset.idx);
          render(currentYear, currentMonth);
        });
        tabs.appendChild(btn);
      });
    }

    // ===== 年份 =====
    document.getElementById('prevYearBtn').addEventListener('click', () => { collapseAll(); currentYear--; render(currentYear, currentMonth); });
    document.getElementById('nextYearBtn').addEventListener('click', () => { collapseAll(); currentYear++; render(currentYear, currentMonth); });

    // ===== Gist =====
    async function saveGist() {
      const token = gistToken.value.trim();
      if (!token) return showToast('⚠️ 请输入 Token', 'error');
      const id = gistId.value.trim();
      if (!id) return showToast('⚠️ 请输入 Gist ID', 'error');
      const file = gistFile.value.trim() || 'calendar_notes.json';
      localStorage.setItem('github_gist_token', token);
      localStorage.setItem('gist_id_last', id);

      try {
        const r = await fetch(`https://api.github.com/gists/${id}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { [file]: { content: JSON.stringify(notes, null, 2) } } })
        });
        if (!r.ok) { const e = await r.json(); throw new Error(e.message || '失败'); }
        showToast('✅ 更新成功！已保存到 Gist', 'success');
      } catch(e) { showToast('❌ 保存失败: '+e.message, 'error', 3000); }
    }

    async function loadGist() {
      const token = gistToken.value.trim();
      if (!token) return showToast('⚠️ 请输入 Token', 'error');
      const id = gistId.value.trim();
      if (!id) return showToast('⚠️ 请输入 Gist ID', 'error');
      const file = gistFile.value.trim() || 'calendar_notes.json';
      localStorage.setItem('github_gist_token', token);
      localStorage.setItem('gist_id_last', id);

      try {
        const r = await fetch(`https://api.github.com/gists/${id}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!r.ok) { const e = await r.json(); throw new Error(e.message || '加载失败'); }
        const data = await r.json();
        const content = data.files[file]?.content;
        if (!content) return showToast('⚠️ 未找到文件: '+file, 'error');
        const parsed = JSON.parse(content);
        if (typeof parsed === 'object' && !Array.isArray(parsed)) {
          notes = parsed;
          saveStorage();
          render(currentYear, currentMonth);
          showToast('✅ 已从 Gist 加载', 'success');
        } else throw new Error('数据格式无效');
      } catch(e) { showToast('❌ 加载失败: '+e.message, 'error', 3000); }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'calendar_notes.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      showToast('📥 导出成功', 'success');
    }

    function importJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (typeof parsed === 'object' && !Array.isArray(parsed)) {
              notes = parsed; saveStorage(); render(currentYear, currentMonth);
              showToast('✅ 导入成功', 'success');
            } else showToast('❌ 无效格式', 'error');
          } catch(err) { showToast('❌ 解析失败: '+err.message, 'error', 2500); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    document.getElementById('saveToGistBtn').addEventListener('click', saveGist);
    document.getElementById('loadFromGistBtn').addEventListener('click', loadGist);
    document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
    document.getElementById('importJsonBtn').addEventListener('click', importJSON);

    // ===== 恢复存储 =====
    const savedToken = localStorage.getItem('github_gist_token');
    if (savedToken) gistToken.value = savedToken;
    const savedId = localStorage.getItem('gist_id_last');
    if (savedId) gistId.value = savedId;

    // ===== 启动 =====
    loadStorage();
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    initTabs();
    render(currentYear, currentMonth);
  })();
</script>
</body>
</html>
