<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 树形书签管理器</title>
    <style>
        /* ... 所有样式保持不变，为了节省篇幅这里省略，使用之前的完整样式 ... */
        /* 实际使用时请复制完整的样式部分 */
    </style>
</head>
<body>
    <!-- ... HTML结构保持不变 ... -->
    
    <script>
        // ========== 数据（树形结构） ==========
        let bookmarkTree = {
            name: '根目录',
            children: [],
            bookmarks: []
        };
        
        let editTarget = null;
        let importPreviewData = null;
        let config = { token: '', gistId: '' };
        let selectedItems = new Set();
        const GIST_FILENAME = 'bookmarks.json';
        let nodeMap = {};
        
        // ========== 数据迁移 ==========
        function migrateOldData() {
            // 检查是否有旧数据
            const oldData = localStorage.getItem('bookmarkData');
            if (oldData) {
                try {
                    const parsed = JSON.parse(oldData);
                    // 检查是否是旧格式 (有 folders 和 uncategorized)
                    if (parsed.folders !== undefined || parsed.uncategorized !== undefined) {
                        console.log('🔄 检测到旧数据格式，正在迁移...');
                        
                        // 创建新的树形结构
                        const newTree = {
                            name: '根目录',
                            children: [],
                            bookmarks: []
                        };
                        
                        // 迁移文件夹
                        if (parsed.folders) {
                            for (const [folderName, bookmarks] of Object.entries(parsed.folders)) {
                                if (bookmarks.length > 0) {
                                    newTree.children.push({
                                        name: folderName,
                                        children: [],
                                        bookmarks: bookmarks.map(b => ({
                                            title: b.title || b.url,
                                            url: b.url,
                                            tags: b.tags || []
                                        }))
                                    });
                                }
                            }
                        }
                        
                        // 迁移未分类
                        if (parsed.uncategorized && parsed.uncategorized.length > 0) {
                            newTree.bookmarks = parsed.uncategorized.map(b => ({
                                title: b.title || b.url,
                                url: b.url,
                                tags: b.tags || []
                            }));
                        }
                        
                        // 保存新数据
                        bookmarkTree = newTree;
                        bookmarkTree.updatedAt = new Date().toISOString();
                        saveToLocal();
                        
                        // 删除旧数据
                        localStorage.removeItem('bookmarkData');
                        
                        console.log('✅ 数据迁移成功！');
                        console.log('📊 迁移了 ' + countTotalBookmarks(bookmarkTree) + ' 个书签，' + countFolders(bookmarkTree) + ' 个分类');
                        
                        // 显示迁移提示
                        setTimeout(function() {
                            showToast('✅ 旧数据已自动迁移到新格式', 'success');
                        }, 500);
                        
                        return true;
                    }
                } catch (e) {
                    console.error('迁移数据失败:', e);
                }
            }
            return false;
        }
        
        // ========== 配置 ==========
        function loadConfig() {
            const saved = localStorage.getItem('gistConfig');
            if (saved) {
                try {
                    config = JSON.parse(saved);
                    document.getElementById('configToken').value = config.token || '';
                    document.getElementById('configGistId').value = config.gistId || '';
                } catch (e) {}
            }
            updateConfigStatus();
        }
        
        function saveConfig() {
            config.token = document.getElementById('configToken').value.trim();
            config.gistId = document.getElementById('configGistId').value.trim();
            localStorage.setItem('gistConfig', JSON.stringify(config));
            updateConfigStatus();
            showToast('✅ 配置已保存', 'success');
        }
        
        function updateConfigStatus() {
            const hasConfig = config.token && config.token.length > 0;
            const indicator = document.getElementById('configIndicator');
            const text = document.getElementById('configStatusText');
            
            if (hasConfig) {
                indicator.className = 'config-indicator configured';
                text.textContent = '已配置 Token' + (config.gistId ? ' | Gist: ' + config.gistId : '');
            } else {
                indicator.className = 'config-indicator not-configured';
                text.textContent = '未配置';
            }
        }
        
        function toggleConfig() {
            const section = document.getElementById('configSection');
            section.classList.toggle('active');
            if (section.classList.contains('active')) loadConfig();
        }
        
        async function testConfig() {
            const token = document.getElementById('configToken').value.trim();
            if (!token) { showToast('请先填写Token', 'error'); return; }
            
            try {
                showToast('正在测试...', 'info');
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': 'token ' + token }
                });
                if (response.ok) {
                    const user = await response.json();
                    showToast('✅ Token有效！用户: ' + user.login, 'success');
                } else {
                    showToast('❌ Token无效', 'error');
                }
            } catch (error) {
                showToast('❌ 连接失败', 'error');
            }
        }
        
        function getConfig() {
            return {
                token: document.getElementById('configToken').value.trim() || config.token,
                gistId: document.getElementById('configGistId').value.trim() || config.gistId
            };
        }
        
        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();
            
            // 先尝试迁移旧数据
            const migrated = migrateOldData();
            
            // 如果没有迁移，从新格式加载
            if (!migrated) {
                loadFromLocal();
            }
            
            renderTree();
            updateStats();
            updateSelects();
            console.log('🌳 树形书签管理器已加载');
            console.log('📁 支持嵌套分类');
        });
        
        // ========== 本地存储 ==========
        function saveToLocal() {
            localStorage.setItem('bookmarkTree', JSON.stringify(bookmarkTree));
        }
        
        function loadFromLocal() {
            const cached = localStorage.getItem('bookmarkTree');
            if (cached) {
                try {
                    bookmarkTree = JSON.parse(cached);
                    // 确保根节点有必要的字段
                    if (!bookmarkTree.name) bookmarkTree.name = '根目录';
                    if (!bookmarkTree.children) bookmarkTree.children = [];
                    if (!bookmarkTree.bookmarks) bookmarkTree.bookmarks = [];
                } catch (e) {
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
            buildNodeMap();
        }
        
        function initDefaultData() {
            bookmarkTree = {
                name: '根目录',
                children: [
                    {
                        name: '常用网站',
                        children: [],
                        bookmarks: [
                            { title: 'GitHub', url: 'https://github.com', tags: ['开发'] },
                            { title: 'Google', url: 'https://www.google.com', tags: ['搜索'] }
                        ]
                    },
                    {
                        name: '技术博客',
                        children: [],
                        bookmarks: [
                            { title: 'MDN', url: 'https://developer.mozilla.org', tags: ['文档'] }
                        ]
                    }
                ],
                bookmarks: []
            };
            saveToLocal();
            buildNodeMap();
        }
        
        // ========== 节点映射 ==========
        function buildNodeMap() {
            nodeMap = {};
            traverseTree(bookmarkTree, '');
        }
        
        function traverseTree(node, path) {
            if (!node) return;
            const currentPath = path ? path + '/' + node.name : node.name;
            nodeMap[currentPath] = node;
            if (node.children) {
                node.children.forEach(child => {
                    traverseTree(child, currentPath);
                });
            }
        }
        
        function getNodeByPath(path) {
            return nodeMap[path] || null;
        }
        
        function getPathForNode(targetNode) {
            for (const [path, node] of Object.entries(nodeMap)) {
                if (node === targetNode) return path;
            }
            return null;
        }
        
        // ========== 统计 ==========
        function countTotalBookmarks(node) {
            if (!node) return 0;
            let count = node.bookmarks ? node.bookmarks.length : 0;
            if (node.children) {
                node.children.forEach(child => {
                    count += countTotalBookmarks(child);
                });
            }
            return count;
        }
        
        function countFolders(node) {
            if (!node) return 0;
            let count = node.children ? node.children.length : 0;
            if (node.children) {
                node.children.forEach(child => {
                    count += countFolders(child);
                });
            }
            return count;
        }
        
        function updateStats() {
            const total = countTotalBookmarks(bookmarkTree);
            const folders = countFolders(bookmarkTree);
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('folderCount').textContent = folders;
            document.getElementById('lastUpdate').textContent = bookmarkTree.updatedAt ? 
                new Date(bookmarkTree.updatedAt).toLocaleString() : '从未';
        }
        
        // ========== 更新下拉菜单 ==========
        function updateSelects() {
            const selects = ['bookmarkFolder', 'editBookmarkFolder', 'parentFolder', 'batchMoveTarget'];
            const paths = getAllFolderPaths(bookmarkTree);
            
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '';
                
                if (id === 'batchMoveTarget' || id === 'parentFolder') {
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = id === 'batchMoveTarget' ? '移动到...' : '根目录';
                    select.appendChild(defaultOpt);
                }
                
                paths.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p;
                    option.textContent = p;
                    select.appendChild(option);
                });
                
                if (currentVal && paths.indexOf(currentVal) !== -1) {
                    select.value = currentVal;
                }
            });
        }
        
        function getAllFolderPaths(node, parentPath) {
            if (!node) return [];
            let paths = [];
            const currentPath = parentPath ? parentPath + '/' + node.name : node.name;
            
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    const childPaths = getAllFolderPaths(child, currentPath);
                    paths = paths.concat(childPaths);
                });
            }
            
            if (node !== bookmarkTree) {
                paths.push(currentPath);
            }
            
            return paths;
        }
        
        // ========== 查找节点 ==========
        function findParentNode(node, targetChild) {
            if (!node.children) return null;
            for (const child of node.children) {
                if (child === targetChild) return node;
                const result = findParentNode(child, targetChild);
                if (result) return result;
            }
            return null;
        }
        
        // ========== 渲染树 ==========
        function renderTree() {
            const container = document.getElementById('treeContainer');
            
            if (!bookmarkTree.children || bookmarkTree.children.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📖</div>
                        <h3>暂无书签</h3>
                        <p>点击「添加书签」或「导入HTML」开始管理</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="tree-node root-node">';
            html += '<div class="node-content" onclick="toggleNode(this)">';
            html += '<span class="toggle-icon expanded">▶</span>';
            html += '<span class="folder-icon">📂</span>';
            html += '<span class="folder-name">📚 书签栏</span>';
            html += '<span class="folder-count">(' + countFolders(bookmarkTree) + ' 个分类, ' + countTotalBookmarks(bookmarkTree) + ' 个书签)</span>';
            html += '</div>';
            html += '<div class="children expanded">';
            
            bookmarkTree.children.forEach(child => {
                html += renderTreeNode(child, 1);
            });
            
            if (bookmarkTree.bookmarks && bookmarkTree.bookmarks.length > 0) {
                bookmarkTree.bookmarks.forEach((bookmark, index) => {
                    html += renderBookmarkItem(bookmark, '根目录', index);
                });
            }
            
            html += '</div></div>';
            container.innerHTML = html;
            updateSelects();
            updateSelectionUI();
        }
        
        function renderTreeNode(node, level) {
            const nodeId = 'folder|' + getPathForNode(node);
            const isSelected = selectedItems.has(nodeId);
            const bookmarkCount = node.bookmarks ? node.bookmarks.length : 0;
            const childCount = node.children ? node.children.length : 0;
            
            let html = '<div class="tree-node' + (isSelected ? ' selected' : '') + '" data-id="' + nodeId + '">';
            html += '<div class="node-content" onclick="toggleNode(this)">';
            html += '<span class="toggle-icon">▶</span>';
            html += '<input type="checkbox" class="folder-checkbox" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation();toggleFolderSelect(\'' + nodeId + '\')">';
            html += '<span class="folder-icon">📁</span>';
            html += '<span class="folder-name">' + node.name + '</span>';
            html += '<span class="folder-count">(' + bookmarkCount + ' 书签' + (childCount > 0 ? ', ' + childCount + ' 子分类' : '') + ')</span>';
            html += '<span class="folder-actions">';
            html += '<button class="btn btn-xs btn-outline" onclick="event.stopPropagation();moveFolder(\'' + nodeId + '\')">📂 移动</button>';
            html += '<button class="btn btn-xs btn-outline" onclick="event.stopPropagation();showAddSubFolder(\'' + nodeId + '\')">➕ 子分类</button>';
            html += '<button class="btn btn-xs btn-outline" onclick="event.stopPropagation();renameFolder(\'' + nodeId + '\')">✏️</button>';
            html += '<button class="btn btn-xs btn-danger" onclick="event.stopPropagation();deleteFolder(\'' + nodeId + '\')">🗑️</button>';
            html += '</span>';
            html += '</div>';
            html += '<div class="children">';
            
            if (node.children) {
                node.children.forEach(child => {
                    html += renderTreeNode(child, level + 1);
                });
            }
            
            if (node.bookmarks) {
                node.bookmarks.forEach((bookmark, index) => {
                    html += renderBookmarkItem(bookmark, nodeId, index);
                });
            }
            
            html += '</div></div>';
            return html;
        }
        
        function renderBookmarkItem(bookmark, folderId, index) {
            const favicon = 'https://www.google.com/s2/favicons?domain=' + bookmark.url;
            const tags = bookmark.tags ? bookmark.tags.map(function(t) { return '<span class="tag">#' + t + '</span>'; }).join('') : '';
            const id = 'bookmark|' + folderId + '|' + index;
            const checked = selectedItems.has(id) ? 'checked' : '';
            
            return '<div class="bookmark-item' + (checked ? ' selected' : '') + '" data-id="' + id + '" data-folder="' + folderId + '" data-index="' + index + '">' +
                '<input type="checkbox" class="checkbox" ' + checked + ' onchange="toggleBookmarkSelect(this, \'' + folderId + '\', ' + index + ')">' +
                '<img src="' + favicon + '" alt="favicon" class="favicon" onerror="this.style.display=\'none\'">' +
                '<span class="bookmark-title"><a href="' + bookmark.url + '" target="_blank" title="' + (bookmark.title || bookmark.url) + '">' + (bookmark.title || bookmark.url) + '</a></span>' +
                '<span class="bookmark-url"><a href="' + bookmark.url + '" target="_blank">' + bookmark.url + '</a></span>' +
                (tags ? '<span class="bookmark-tags">' + tags + '</span>' : '') +
                '<span class="item-actions">' +
                '<button class="btn btn-xs btn-outline" onclick="moveSingle(\'' + folderId + '\', ' + index + ')">📂 移动</button>' +
                '<button class="btn btn-xs btn-outline" onclick="editBookmark(\'' + folderId + '\', ' + index + ')">✏️</button>' +
                '<button class="btn btn-xs btn-danger" onclick="deleteBookmark(\'' + folderId + '\', ' + index + ')">🗑️</button>' +
                '</span>' +
                '</div>';
        }
        
        // ========== 树操作 ==========
        function toggleNode(el) {
            var children = el.parentElement.querySelector('.children');
            var icon = el.querySelector('.toggle-icon');
            if (children) {
                children.classList.toggle('expanded');
                icon.classList.toggle('expanded');
            }
        }
        
        function expandAll() {
            document.querySelectorAll('.tree-node .children').forEach(function(c) { c.classList.add('expanded'); });
            document.querySelectorAll('.tree-node .toggle-icon').forEach(function(c) { c.classList.add('expanded'); });
        }
        
        function collapseAll() {
            document.querySelectorAll('.tree-node .children').forEach(function(c) { c.classList.remove('expanded'); });
            document.querySelectorAll('.tree-node .toggle-icon').forEach(function(c) { c.classList.remove('expanded'); });
            var rootChildren = document.querySelector('.root-node .children');
            if (rootChildren) rootChildren.classList.add('expanded');
            var rootIcon = document.querySelector('.root-node .toggle-icon');
            if (rootIcon) rootIcon.classList.add('expanded');
        }
        
        // ========== 选择管理 ==========
        function toggleBookmarkSelect(checkbox, folderId, index) {
            var id = 'bookmark|' + folderId + '|' + index;
            if (checkbox.checked) {
                selectedItems.add(id);
            } else {
                selectedItems.delete(id);
            }
            updateSelectionUI();
        }
        
        function toggleFolderSelect(nodeId) {
            if (selectedItems.has(nodeId)) {
                selectedItems.delete(nodeId);
            } else {
                selectedItems.add(nodeId);
            }
            updateSelectionUI();
        }
        
        function clearSelection() {
            selectedItems.clear();
            updateSelectionUI();
        }
        
        function updateSelectionUI() {
            document.querySelectorAll('.bookmark-item .checkbox').forEach(function(cb) {
                var item = cb.closest('.bookmark-item');
                var id = item.dataset.id;
                cb.checked = selectedItems.has(id);
                item.classList.toggle('selected', cb.checked);
            });
            
            document.querySelectorAll('.tree-node .folder-checkbox').forEach(function(cb) {
                var node = cb.closest('.tree-node');
                var id = node.dataset.id;
                cb.checked = selectedItems.has(id);
                node.classList.toggle('selected', cb.checked);
            });
            
            var count = selectedItems.size;
            var bar = document.getElementById('batchBar');
            document.getElementById('selectedCount').textContent = count;
            
            var bookmarkCount = 0;
            var folderCount = 0;
            selectedItems.forEach(function(id) {
                if (id.startsWith('bookmark|')) bookmarkCount++;
                else if (id.startsWith('folder|')) folderCount++;
            });
            
            var typeText = '';
            if (bookmarkCount > 0 && folderCount > 0) {
                typeText = bookmarkCount + '个书签, ' + folderCount + '个分类';
            } else if (bookmarkCount > 0) {
                typeText = bookmarkCount + '个书签';
            } else if (folderCount > 0) {
                typeText = folderCount + '个分类';
            } else {
                typeText = '无';
            }
            document.getElementById('selectedType').textContent = typeText;
            
            if (count > 0) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        }
        
        // ========== 批量操作 ==========
        function batchMove() {
            var targetPath = document.getElementById('batchMoveTarget').value;
            if (!targetPath) {
                showToast('请选择目标分类', 'warning');
                return;
            }
            
            if (selectedItems.size === 0) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            var targetNode = getNodeByPath(targetPath);
            if (!targetNode) {
                showToast('目标分类不存在', 'error');
                return;
            }
            
            if (!confirm('确定将 ' + selectedItems.size + ' 项移动到 "' + targetPath + '" 吗？')) return;
            
            var items = Array.from(selectedItems);
            var movedBookmarks = 0;
            var movedFolders = 0;
            
            items.forEach(function(id) {
                if (id.startsWith('bookmark|')) {
                    var parts = id.split('|');
                    var folderPath = parts[1];
                    var idx = parseInt(parts[2]);
                    var sourceNode = getNodeByPath(folderPath);
                    
                    if (sourceNode && sourceNode.bookmarks && sourceNode.bookmarks[idx]) {
                        var bookmark = sourceNode.bookmarks[idx];
                        sourceNode.bookmarks.splice(idx, 1);
                        if (!targetNode.bookmarks) targetNode.bookmarks = [];
                        targetNode.bookmarks.push(bookmark);
                        movedBookmarks++;
                    }
                } else if (id.startsWith('folder|')) {
                    var folderPath = id.replace('folder|', '');
                    var sourceNode = getNodeByPath(folderPath);
                    
                    if (sourceNode && sourceNode !== bookmarkTree) {
                        if (folderPath === targetPath || targetPath.startsWith(folderPath + '/')) {
                            showToast('不能将分类移动到自身或子分类中', 'warning');
                            return;
                        }
                        
                        var parent = findParentNode(bookmarkTree, sourceNode);
                        if (parent) {
                            var index = parent.children.indexOf(sourceNode);
                            if (index !== -1) {
                                parent.children.splice(index, 1);
                                if (!targetNode.children) targetNode.children = [];
                                targetNode.children.push(sourceNode);
                                movedFolders++;
                            }
                        }
                    }
                }
            });
            
            selectedItems.clear();
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            
            var msg = '✅ 成功移动';
            if (movedBookmarks > 0) msg += ' ' + movedBookmarks + ' 个书签';
            if (movedFolders > 0) msg += ' ' + movedFolders + ' 个分类';
            msg += ' 到 "' + targetPath + '"';
            showToast(msg, 'success');
        }
        
        function batchDelete() {
            if (selectedItems.size === 0) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            var bookmarkCount = 0;
            var folderCount = 0;
            selectedItems.forEach(function(id) {
                if (id.startsWith('bookmark|')) bookmarkCount++;
                else if (id.startsWith('folder|')) folderCount++;
            });
            
            var msg = '⚠️ 确定要删除 ';
            if (bookmarkCount > 0) msg += bookmarkCount + ' 个书签';
            if (bookmarkCount > 0 && folderCount > 0) msg += ' 和 ';
            if (folderCount > 0) msg += folderCount + ' 个分类（包括其子分类和书签）';
            msg += ' 吗？此操作不可撤销！';
            
            if (!confirm(msg)) return;
            
            var items = Array.from(selectedItems);
            var deletedBookmarks = 0;
            var deletedFolders = 0;
            
            items.forEach(function(id) {
                if (id.startsWith('bookmark|')) {
                    var parts = id.split('|');
                    var folderPath = parts[1];
                    var idx = parseInt(parts[2]);
                    var node = getNodeByPath(folderPath);
                    if (node && node.bookmarks && node.bookmarks[idx]) {
                        node.bookmarks.splice(idx, 1);
                        deletedBookmarks++;
                    }
                } else if (id.startsWith('folder|')) {
                    var folderPath = id.replace('folder|', '');
                    var node = getNodeByPath(folderPath);
                    if (node && node !== bookmarkTree) {
                        var parent = findParentNode(bookmarkTree, node);
                        if (parent) {
                            var index = parent.children.indexOf(node);
                            if (index !== -1) {
                                deletedBookmarks += countTotalBookmarks(node);
                                parent.children.splice(index, 1);
                                deletedFolders++;
                            }
                        }
                    }
                }
            });
            
            selectedItems.clear();
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            
            var resultMsg = '✅ 成功删除';
            if (deletedBookmarks > 0) resultMsg += ' ' + deletedBookmarks + ' 个书签';
            if (deletedFolders > 0) resultMsg += ' ' + deletedFolders + ' 个分类';
            showToast(resultMsg, 'success');
        }
        
        // ========== 单个移动 ==========
        function moveSingle(folderPath, index) {
            selectedItems.clear();
            selectedItems.add('bookmark|' + folderPath + '|' + index);
            updateSelectionUI();
            document.getElementById('batchMoveTarget').focus();
            showToast('📂 请选择目标分类后点击"移动"', 'info');
            document.getElementById('batchMoveTarget').scrollIntoView({ behavior: 'smooth' });
        }
        
        function moveFolder(nodeId) {
            selectedItems.clear();
            selectedItems.add(nodeId);
            updateSelectionUI();
            document.getElementById('batchMoveTarget').focus();
            showToast('📂 分类已选中，请选择目标分类后点击"移动"', 'info');
            document.getElementById('batchMoveTarget').scrollIntoView({ behavior: 'smooth' });
        }
        
        // ========== 添加分类 ==========
        function showAddFolder() {
            document.getElementById('folderName').value = '';
            updateSelects();
            openModal('addFolderModal');
        }
        
        function showAddSubFolder(parentId) {
            var path = parentId.replace('folder|', '');
            document.getElementById('folderName').value = '';
            updateSelects();
            document.getElementById('parentFolder').value = path;
            openModal('addFolderModal');
        }
        
        function addFolder() {
            var name = document.getElementById('folderName').value.trim();
            var parentPath = document.getElementById('parentFolder').value;
            
            if (!name) { showToast('请输入分类名称', 'error'); return; }
            
            var parentNode = parentPath ? getNodeByPath(parentPath) : bookmarkTree;
            if (!parentNode) { showToast('父分类不存在', 'error'); return; }
            
            if (parentNode.children) {
                for (var child of parentNode.children) {
                    if (child.name === name) {
                        showToast('该分类下已存在同名分类', 'error');
                        return;
                    }
                }
            }
            
            var newFolder = {
                name: name,
                children: [],
                bookmarks: []
            };
            
            if (!parentNode.children) parentNode.children = [];
            parentNode.children.push(newFolder);
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            closeModal('addFolderModal');
            showToast('✅ 分类创建成功', 'success');
        }
        
        // ========== 重命名分类 ==========
        function renameFolder(nodeId) {
            var path = nodeId.replace('folder|', '');
            var node = getNodeByPath(path);
            if (!node || node === bookmarkTree) return;
            
            var newName = prompt('将 "' + node.name + '" 重命名为:', node.name);
            if (!newName || newName === node.name) return;
            
            node.name = newName;
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            showToast('✅ 重命名成功', 'success');
        }
        
        // ========== 删除分类 ==========
        function deleteFolder(nodeId) {
            var path = nodeId.replace('folder|', '');
            var node = getNodeByPath(path);
            if (!node || node === bookmarkTree) return;
            
            var count = countTotalBookmarks(node);
            var childCount = countFolders(node);
            var msg = '确定要删除分类 "' + node.name + '" 吗？';
            if (count > 0) msg += '\n包含 ' + count + ' 个书签';
            if (childCount > 0) msg += '\n包含 ' + childCount + ' 个子分类';
            msg += '\n此操作不可撤销！';
            
            if (!confirm(msg)) return;
            
            var parent = findParentNode(bookmarkTree, node);
            if (parent) {
                var index = parent.children.indexOf(node);
                if (index !== -1) {
                    parent.children.splice(index, 1);
                }
            }
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            showToast('已删除分类', 'success');
        }
        
        // ========== 添加书签 ==========
        function showAddBookmark() {
            document.getElementById('bookmarkTitle').value = '';
            document.getElementById('bookmarkUrl').value = '';
            document.getElementById('bookmarkTags').value = '';
            updateSelects();
            openModal('addBookmarkModal');
        }
        
        function addBookmark() {
            var title = document.getElementById('bookmarkTitle').value.trim();
            var url = document.getElementById('bookmarkUrl').value.trim();
            var folderPath = document.getElementById('bookmarkFolder').value;
            var tags = document.getElementById('bookmarkTags').value.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t; });
            
            if (!title || !url) { showToast('请填写标题和URL', 'error'); return; }
            if (!url.match(/^https?:\/\/.+/)) { showToast('请输入有效的URL', 'error'); return; }
            
            var targetNode = folderPath ? getNodeByPath(folderPath) : bookmarkTree;
            if (!targetNode) { showToast('目标分类不存在', 'error'); return; }
            
            if (!targetNode.bookmarks) targetNode.bookmarks = [];
            targetNode.bookmarks.push({ title: title, url: url, tags: tags });
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            closeModal('addBookmarkModal');
            showToast('✅ 书签添加成功', 'success');
        }
        
        // ========== 编辑书签 ==========
        function editBookmark(folderPath, index) {
            var node = getNodeByPath(folderPath);
            if (!node || !node.bookmarks || !node.bookmarks[index]) return;
            
            var bookmark = node.bookmarks[index];
            editTarget = { folderPath: folderPath, index: index };
            document.getElementById('editBookmarkTitle').value = bookmark.title || '';
            document.getElementById('editBookmarkUrl').value = bookmark.url || '';
            document.getElementById('editBookmarkTags').value = (bookmark.tags || []).join(', ');
            updateSelects();
            document.getElementById('editBookmarkFolder').value = folderPath;
            openModal('editBookmarkModal');
        }
        
        function saveEditBookmark() {
            var title = document.getElementById('editBookmarkTitle').value.trim();
            var url = document.getElementById('editBookmarkUrl').value.trim();
            var folderPath = document.getElementById('editBookmarkFolder').value;
            var tags = document.getElementById('editBookmarkTags').value.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t; });
            
            if (!title || !url) { showToast('请填写完整信息', 'error'); return; }
            
            var oldNode = getNodeByPath(editTarget.folderPath);
            if (!oldNode || !oldNode.bookmarks || !oldNode.bookmarks[editTarget.index]) return;
            
            var bookmark = oldNode.bookmarks[editTarget.index];
            
            if (folderPath !== editTarget.folderPath) {
                var newNode = getNodeByPath(folderPath);
                if (!newNode) { showToast('目标分类不存在', 'error'); return; }
                
                oldNode.bookmarks.splice(editTarget.index, 1);
                bookmark.title = title;
                bookmark.url = url;
                bookmark.tags = tags;
                if (!newNode.bookmarks) newNode.bookmarks = [];
                newNode.bookmarks.push(bookmark);
            } else {
                bookmark.title = title;
                bookmark.url = url;
                bookmark.tags = tags;
            }
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            closeModal('editBookmarkModal');
            showToast('✅ 更新成功', 'success');
        }
        
        // ========== 删除书签 ==========
        function deleteBookmark(folderPath, index) {
            if (!confirm('确定要删除这个书签吗？')) return;
            
            var node = getNodeByPath(folderPath);
            if (node && node.bookmarks && node.bookmarks[index]) {
                node.bookmarks.splice(index, 1);
            }
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            showToast('已删除', 'success');
        }
        
        // ========== 导入HTML ==========
        function importHTML() {
            document.getElementById('htmlFileInput').value = '';
            document.getElementById('htmlContent').value = '';
            document.getElementById('importPreview').style.display = 'none';
            document.getElementById('importMerge').checked = true;
            importPreviewData = null;
            openModal('importModal');
        }
        
        function previewHTMLImport(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('htmlContent').value = e.target.result;
                parseHTMLContent(e.target.result);
            };
            reader.readAsText(file);
        }
        
        document.getElementById('htmlContent').addEventListener('input', function() {
            if (this.value.trim()) {
                parseHTMLContent(this.value);
            } else {
                document.getElementById('importPreview').style.display = 'none';
                importPreviewData = null;
            }
        });
        
        function parseHTMLContent(html) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var result = { tree: { name: '导入', children: [], bookmarks: [] }, currentPath: [] };
            var currentFolder = result.tree;
            
            var dts = doc.querySelectorAll('DT');
            dts.forEach(function(dt) {
                var h3 = dt.querySelector('H3');
                if (h3) {
                    var folderName = h3.textContent.trim();
                    var newFolder = { name: folderName, children: [], bookmarks: [] };
                    currentFolder.children.push(newFolder);
                    currentFolder = newFolder;
                    return;
                }
                var a = dt.querySelector('A');
                if (a) {
                    var href = a.getAttribute('HREF');
                    if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                        currentFolder.bookmarks.push({
                            title: a.textContent.trim() || href,
                            url: href,
                            tags: []
                        });
                    }
                }
            });
            
            if (result.tree.children.length === 0) {
                var links = doc.querySelectorAll('a');
                links.forEach(function(link) {
                    var href = link.getAttribute('href');
                    if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                        result.tree.bookmarks.push({
                            title: link.textContent.trim() || href,
                            url: href,
                            tags: []
                        });
                    }
                });
            }
            
            importPreviewData = result.tree;
            showImportPreview(result.tree);
        }
        
        function showImportPreview(node, level) {
            level = level || 0;
            var preview = document.getElementById('importPreview');
            preview.style.display = 'block';
            
            var total = countTotalBookmarks(node);
            var folders = countFolders(node);
            var indent = '  '.repeat(level);
            
            var html = '<div style="margin-bottom:6px;font-weight:600;color:#2d3748;">📊 共 ' + total + ' 个书签，' + folders + ' 个分类</div>';
            
            function renderNode(n, lvl) {
                var ind = '  '.repeat(lvl);
                var html2 = '';
                if (n !== importPreviewData) {
                    html2 += '<div class="folder-group"><div class="folder-name">' + ind + '📁 ' + n.name + ' (' + (n.bookmarks ? n.bookmarks.length : 0) + ' 书签)</div>';
                }
                if (n.bookmarks) {
                    n.bookmarks.slice(0, 10).forEach(function(b) {
                        html2 += '<div class="item">' + ind + '  📌 ' + (b.title || b.url) + ' <span class="url">' + b.url + '</span></div>';
                    });
                    if (n.bookmarks.length > 10) {
                        html2 += '<div class="item" style="color:#a0aec0;">' + ind + '  ... 还有 ' + (n.bookmarks.length - 10) + ' 个</div>';
                    }
                }
                if (n.children) {
                    n.children.forEach(function(c) {
                        html2 += renderNode(c, lvl + 1);
                    });
                }
                if (n !== importPreviewData) {
                    html2 += '</div>';
                }
                return html2;
            }
            
            html += renderNode(node, 0);
            preview.innerHTML = html;
        }
        
        function confirmImportHTML() {
            if (!importPreviewData) { showToast('请先导入HTML内容', 'error'); return; }
            
            var merge = document.getElementById('importMerge').checked;
            if (!merge) {
                bookmarkTree = { name: '根目录', children: [], bookmarks: [] };
            }
            
            function mergeNode(target, source) {
                if (!target.children) target.children = [];
                if (!target.bookmarks) target.bookmarks = [];
                
                if (source.bookmarks) {
                    target.bookmarks = target.bookmarks.concat(source.bookmarks);
                }
                
                if (source.children) {
                    source.children.forEach(function(child) {
                        var existing = target.children.find(function(c) { return c.name === child.name; });
                        if (existing) {
                            mergeNode(existing, child);
                        } else {
                            target.children.push(child);
                        }
                    });
                }
            }
            
            mergeNode(bookmarkTree, importPreviewData);
            
            bookmarkTree.updatedAt = new Date().toISOString();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            closeModal('importModal');
            var total = countTotalBookmarks(importPreviewData);
            showToast('✅ 成功导入 ' + total + ' 个书签', 'success');
        }
        
        // ========== 导出 ==========
        function exportJSON() {
            var data = JSON.stringify(bookmarkTree, null, 2);
            var blob = new Blob([data], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'bookmarks_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 JSON导出成功！', 'success');
        }
        
        function exportHTML() {
            var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>我的书签</title>';
            html += '<style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f7fafc;}';
            html += 'h1{color:#2d3748;border-bottom:3px solid #667eea;padding-bottom:12px;}';
            html += '.folder{margin:20px 0;padding-left:20px;}.folder-title{font-size:18px;font-weight:600;color:#2d3748;margin-bottom:10px;}';
            html += '.bookmark{padding:8px 12px;margin:4px 0;background:white;border-radius:6px;}';
            html += '.bookmark a{color:#667eea;text-decoration:none;font-weight:500;}';
            html += '.bookmark .url{color:#a0aec0;font-size:12px;margin-left:10px;}';
            html += '.footer{margin-top:40px;color:#a0aec0;text-align:center;font-size:13px;}</style>';
            html += '</head><body><h1>📚 我的书签</h1><p style="color:#718096;">导出时间: ' + new Date().toLocaleString() + '</p><hr>';
            
            function renderExportNode(node, level) {
                var ind = '  '.repeat(level);
                var h = '';
                if (node !== bookmarkTree) {
                    h += '<div class="folder"><div class="folder-title">' + ind + '📁 ' + node.name + '</div>';
                }
                if (node.bookmarks) {
                    node.bookmarks.forEach(function(b) {
                        h += '<div class="bookmark">' + ind + '  <a href="' + b.url + '" target="_blank">' + (b.title || b.url) + '</a><span class="url">' + b.url + '</span></div>';
                    });
                }
                if (node.children) {
                    node.children.forEach(function(c) {
                        h += renderExportNode(c, level + 1);
                    });
                }
                if (node !== bookmarkTree) {
                    h += '</div>';
                }
                return h;
            }
            
            html += renderExportNode(bookmarkTree, 0);
            html += '<div class="footer">共 ' + countTotalBookmarks(bookmarkTree) + ' 个书签</div></body></html>';
            
            var blob = new Blob([html], { type: 'text/html; charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'bookmarks_' + new Date().toISOString().split('T')[0] + '.html';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 HTML导出成功！', 'success');
        }
        
        // ========== Gist同步 ==========
        async function syncToGist() {
            var cfg = getConfig();
            if (!cfg.token) {
                showToast('请先配置Token', 'error');
                toggleConfig();
                return;
            }
            
            try {
                var data = JSON.stringify(bookmarkTree, null, 2);
                
                var url = 'https://api.github.com/gists';
                var method = 'POST';
                var body = {
                    description: '书签备份 - ' + new Date().toLocaleString(),
                    public: false,
                    files: {}
                };
                body.files[GIST_FILENAME] = { content: data };
                
                if (cfg.gistId) {
                    url = 'https://api.github.com/gists/' + cfg.gistId;
                    method = 'PATCH';
                    body = {
                        description: '书签更新 - ' + new Date().toLocaleString(),
                        files: {}
                    };
                    body.files[GIST_FILENAME] = { content: data };
                }
                
                var response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': 'token ' + cfg.token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    var error = await response.json();
                    throw new Error(error.message || 'HTTP ' + response.status);
                }
                
                var result = await response.json();
                
                if (!cfg.gistId) {
                    config.gistId = result.id;
                    document.getElementById('configGistId').value = result.id;
                    localStorage.setItem('gistConfig', JSON.stringify(config));
                    updateConfigStatus();
                    showToast('✅ 新Gist创建成功！ID: ' + result.id, 'success');
                } else {
                    showToast('✅ Gist更新成功！ID: ' + result.id, 'success');
                }
                
                if (navigator.clipboard) {
                    try {
                        await navigator.clipboard.writeText(result.id);
                        showToast('📋 Gist ID已复制到剪贴板', 'info');
                    } catch (e) {}
                }
                
            } catch (error) {
                console.error('上传失败:', error);
                showToast('❌ 上传失败: ' + error.message, 'error');
            }
        }
        
        async function syncFromGist() {
            var cfg = getConfig();
            if (!cfg.token) {
                showToast('请先配置Token', 'error');
                toggleConfig();
                return;
            }
            
            var gistId = cfg.gistId;
            if (!gistId) {
                gistId = prompt('请输入Gist ID:');
                if (!gistId) return;
            }
            
            try {
                showToast('📥 正在从Gist导入...', 'info');
                
                var response = await fetch('https://api.github.com/gists/' + gistId, {
                    headers: {
                        'Authorization': 'token ' + cfg.token,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    var error = await response.json();
                    throw new Error(error.message || 'HTTP ' + response.status);
                }
                
                var gist = await response.json();
                
                var data = null;
                var foundFile = null;
                
                if (gist.files[GIST_FILENAME]) {
                    foundFile = GIST_FILENAME;
                    data = JSON.parse(gist.files[GIST_FILENAME].content);
                } else {
                    for (var filename in gist.files) {
                        if (filename.endsWith('.json')) {
                            foundFile = filename;
                            data = JSON.parse(gist.files[filename].content);
                            break;
                        }
                    }
                }
                
                if (!data) {
                    throw new Error('未找到JSON数据文件');
                }
                
                if (!data.name) {
                    data.name = '根目录';
                }
                if (!data.children) {
                    data.children = [];
                }
                if (!data.bookmarks) {
                    data.bookmarks = [];
                }
                
                var total = countTotalBookmarks(data);
                var folders = countFolders(data);
                
                if (total === 0 && folders === 0) {
                    throw new Error('数据为空');
                }
                
                if (!confirm('📊 找到 ' + total + ' 个书签，' + folders + ' 个分类\n\n确定导入吗？将替换当前所有数据！')) {
                    return;
                }
                
                bookmarkTree = data;
                bookmarkTree.updatedAt = new Date().toISOString();
                
                if (!cfg.gistId) {
                    config.gistId = gistId;
                    document.getElementById('configGistId').value = gistId;
                    localStorage.setItem('gistConfig', JSON.stringify(config));
                    updateConfigStatus();
                }
                
                selectedItems.clear();
                buildNodeMap();
                renderTree();
                updateStats();
                updateSelects();
                saveToLocal();
                
                showToast('✅ 导入成功！共 ' + total + ' 个书签，' + folders + ' 个分类', 'success');
                
            } catch (error) {
                console.error('导入失败:', error);
                showToast('❌ 导入失败: ' + error.message, 'error');
            }
        }
        
        // ========== 清空 ==========
        function clearAll() {
            if (!confirm('⚠️ 确定要清空所有书签吗？')) return;
            bookmarkTree = { name: '根目录', children: [], bookmarks: [], updatedAt: new Date().toISOString() };
            selectedItems.clear();
            buildNodeMap();
            renderTree();
            updateStats();
            updateSelects();
            saveToLocal();
            showToast('已清空所有书签', 'warning');
        }
        
        // ========== 搜索 ==========
        document.getElementById('searchInput').addEventListener('input', function(e) {
            var keyword = e.target.value.toLowerCase();
            var items = document.querySelectorAll('.bookmark-item');
            
            items.forEach(function(item) {
                var title = item.querySelector('.bookmark-title a')?.textContent?.toLowerCase() || '';
                var url = item.querySelector('.bookmark-url a')?.textContent?.toLowerCase() || '';
                var match = title.indexOf(keyword) !== -1 || url.indexOf(keyword) !== -1;
                item.style.display = match ? '' : 'none';
            });
            
            document.querySelectorAll('.tree-node .children').forEach(function(children) {
                var items = children.querySelectorAll('.bookmark-item');
                var visible = false;
                items.forEach(function(item) {
                    if (item.style.display !== 'none') visible = true;
                });
                var parentNode = children.closest('.tree-node');
                if (parentNode) {
                    parentNode.style.display = visible ? '' : 'none';
                    if (visible) {
                        children.classList.add('expanded');
                        var icon = parentNode.querySelector('.toggle-icon');
                        if (icon) icon.classList.add('expanded');
                    }
                }
            });
        });
        
        // ========== UI工具 ==========
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        document.querySelectorAll('.modal').forEach(function(modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });
        
        function showToast(message, type) {
            type = type || 'info';
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }
        
        // ========== 快捷键 ==========
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.active').forEach(function(modal) {
                    modal.classList.remove('active');
                });
            }
        });
    </script>
