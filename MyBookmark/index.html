<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 树形书签管理器</title>
    <style>
        /* ... 保持之前的样式不变 ... */
        /* 为了节省篇幅，样式部分省略，使用之前的完整样式 */
    </style>
</head>
<body>
    <!-- ... HTML结构保持不变 ... -->
    
    <script>
        // ========== 数据 ==========
        let bookmarkData = {
            folders: {},
            uncategorized: [],
            updatedAt: new Date().toISOString()
        };
        
        let editTarget = null;
        let importPreviewData = null;
        let config = { token: '', gistId: '' };
        let selectedItems = new Set();
        
        // ========== 固定文件名 ==========
        const GIST_FILENAME = 'bookmarks.json';  // 使用固定文件名！
        
        // ========== 配置 ==========
        function loadConfig() {
            const saved = localStorage.getItem('gistConfig');
            if (saved) {
                try {
                    config = JSON.parse(saved);
                    document.getElementById('configToken').value = config.token || '';
                    document.getElementById('configGistId').value = config.gistId || '';
                } catch (e) {}
            }
            updateConfigStatus();
        }
        
        function saveConfig() {
            config.token = document.getElementById('configToken').value.trim();
            config.gistId = document.getElementById('configGistId').value.trim();
            localStorage.setItem('gistConfig', JSON.stringify(config));
            updateConfigStatus();
            showToast('✅ 配置已保存', 'success');
        }
        
        function updateConfigStatus() {
            const hasConfig = config.token && config.token.length > 0;
            const indicator = document.getElementById('configIndicator');
            const text = document.getElementById('configStatusText');
            
            if (hasConfig) {
                indicator.className = 'config-indicator configured';
                text.textContent = '已配置 Token' + (config.gistId ? ` | Gist: ${config.gistId}` : '');
            } else {
                indicator.className = 'config-indicator not-configured';
                text.textContent = '未配置';
            }
        }
        
        function toggleConfig() {
            const section = document.getElementById('configSection');
            section.classList.toggle('active');
            if (section.classList.contains('active')) loadConfig();
        }
        
        async function testConfig() {
            const token = document.getElementById('configToken').value.trim();
            if (!token) { showToast('请先填写Token', 'error'); return; }
            
            try {
                showToast('正在测试...', 'info');
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    showToast(`✅ Token有效！用户: ${user.login}`, 'success');
                } else {
                    showToast('❌ Token无效', 'error');
                }
            } catch (error) {
                showToast('❌ 连接失败', 'error');
            }
        }
        
        function getConfig() {
            return {
                token: document.getElementById('configToken').value.trim() || config.token,
                gistId: document.getElementById('configGistId').value.trim() || config.gistId
            };
        }
        
        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadFromLocal();
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
        });
        
        // ========== 本地存储 ==========
        function saveToLocal() {
            localStorage.setItem('bookmarkData', JSON.stringify(bookmarkData));
        }
        
        function loadFromLocal() {
            const cached = localStorage.getItem('bookmarkData');
            if (cached) {
                try {
                    bookmarkData = JSON.parse(cached);
                } catch (e) {
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
        }
        
        function initDefaultData() {
            bookmarkData = {
                folders: {
                    '常用网站': [
                        { title: 'GitHub', url: 'https://github.com', tags: ['开发'] },
                        { title: 'Google', url: 'https://www.google.com', tags: ['搜索'] }
                    ],
                    '技术博客': [
                        { title: 'MDN', url: 'https://developer.mozilla.org', tags: ['文档'] }
                    ]
                },
                uncategorized: [],
                updatedAt: new Date().toISOString()
            };
            saveToLocal();
        }
        
        // ========== 渲染树形目录 ==========
        function renderTree() {
            const container = document.getElementById('treeContainer');
            
            if (!bookmarkData.folders || Object.keys(bookmarkData.folders).length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📖</div>
                        <h3>暂无书签</h3>
                        <p>点击「添加书签」或「导入HTML」开始管理</p>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="tree-node root-node">`;
            html += `<div class="node-content" onclick="toggleNode(this)">`;
            html += `<span class="toggle-icon expanded">▶</span>`;
            html += `<span class="folder-icon">📂</span>`;
            html += `<span class="folder-name">📚 书签栏</span>`;
            html += `<span class="folder-count">(${Object.keys(bookmarkData.folders).length} 个分类)</span>`;
            html += `</div>`;
            html += `<div class="children expanded">`;
            
            const sortedFolders = Object.keys(bookmarkData.folders).sort();
            
            for (const folderName of sortedFolders) {
                const bookmarks = bookmarkData.folders[folderName];
                if (bookmarks.length === 0) continue;
                html += renderFolderNode(folderName, bookmarks);
            }
            
            if (bookmarkData.uncategorized && bookmarkData.uncategorized.length > 0) {
                html += renderFolderNode('📌 未分类', bookmarkData.uncategorized, true);
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
            updateBatchTargets();
            updateSelectionUI();
        }
        
        function renderFolderNode(folderName, bookmarks, isUncategorized = false) {
            const folderId = `folder|${folderName}`;
            const isSelected = selectedItems.has(folderId);
            
            let html = `<div class="tree-node ${isSelected ? 'selected' : ''}" data-folder="${folderName}" data-id="${folderId}">`;
            html += `<div class="node-content" onclick="toggleNode(this)">`;
            html += `<span class="toggle-icon">▶</span>`;
            if (!isUncategorized) {
                html += `<input type="checkbox" class="folder-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();toggleFolderSelect('${folderName}')">`;
            }
            html += `<span class="folder-icon">${isUncategorized ? '📌' : '📁'}</span>`;
            html += `<span class="folder-name">${folderName}</span>`;
            html += `<span class="folder-count">(${bookmarks.length})</span>`;
            html += `<span class="folder-actions">`;
            if (!isUncategorized) {
                html += `<button class="btn btn-xs btn-outline" onclick="event.stopPropagation();moveFolder('${folderName}')">📂 移动</button>`;
                html += `<button class="btn btn-xs btn-outline" onclick="event.stopPropagation();renameFolder('${folderName}')">✏️</button>`;
                html += `<button class="btn btn-xs btn-danger" onclick="event.stopPropagation();deleteFolder('${folderName}')">🗑️</button>`;
            }
            html += `</span>`;
            html += `</div>`;
            html += `<div class="children">`;
            
            bookmarks.forEach((bookmark, index) => {
                html += renderBookmarkItem(bookmark, folderName, index);
            });
            
            html += `</div></div>`;
            return html;
        }
        
        function renderBookmarkItem(bookmark, folder, index) {
            const favicon = `https://www.google.com/s2/favicons?domain=${bookmark.url}`;
            const tags = bookmark.tags ? bookmark.tags.map(t => `<span class="tag">#${t}</span>`).join('') : '';
            const id = `bookmark|${folder}|${index}`;
            const checked = selectedItems.has(id) ? 'checked' : '';
            
            return `
                <div class="bookmark-item${checked ? ' selected' : ''}" data-id="${id}" data-folder="${folder}" data-index="${index}">
                    <input type="checkbox" class="checkbox" ${checked} onchange="toggleBookmarkSelect(this, '${folder}', ${index})">
                    <img src="${favicon}" alt="favicon" class="favicon" onerror="this.style.display='none'">
                    <span class="bookmark-title">
                        <a href="${bookmark.url}" target="_blank" title="${bookmark.title || bookmark.url}">${bookmark.title || bookmark.url}</a>
                    </span>
                    <span class="bookmark-url">
                        <a href="${bookmark.url}" target="_blank">${bookmark.url}</a>
                    </span>
                    ${tags ? `<span class="bookmark-tags">${tags}</span>` : ''}
                    <span class="item-actions">
                        <button class="btn btn-xs btn-outline" onclick="moveSingle('${folder}', ${index})">📂 移动</button>
                        <button class="btn btn-xs btn-outline" onclick="editBookmark('${folder}', ${index})">✏️</button>
                        <button class="btn btn-xs btn-danger" onclick="deleteBookmark('${folder}', ${index})">🗑️</button>
                    </span>
                </div>
            `;
        }
        
        // ========== 选择管理 ==========
        function toggleBookmarkSelect(checkbox, folder, index) {
            const id = `bookmark|${folder}|${index}`;
            if (checkbox.checked) {
                selectedItems.add(id);
            } else {
                selectedItems.delete(id);
            }
            updateSelectionUI();
        }
        
        function toggleFolderSelect(folderName) {
            const id = `folder|${folderName}`;
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            updateSelectionUI();
        }
        
        function clearSelection() {
            selectedItems.clear();
            updateSelectionUI();
        }
        
        function updateSelectionUI() {
            document.querySelectorAll('.bookmark-item .checkbox').forEach(cb => {
                const item = cb.closest('.bookmark-item');
                const id = item.dataset.id;
                cb.checked = selectedItems.has(id);
                item.classList.toggle('selected', cb.checked);
            });
            
            document.querySelectorAll('.tree-node .folder-checkbox').forEach(cb => {
                const node = cb.closest('.tree-node');
                const id = node.dataset.id;
                cb.checked = selectedItems.has(id);
                node.classList.toggle('selected', cb.checked);
            });
            
            const count = selectedItems.size;
            const bar = document.getElementById('batchBar');
            document.getElementById('selectedCount').textContent = count;
            
            let bookmarkCount = 0;
            let folderCount = 0;
            selectedItems.forEach(id => {
                if (id.startsWith('bookmark|')) bookmarkCount++;
                else if (id.startsWith('folder|')) folderCount++;
            });
            
            let typeText = '';
            if (bookmarkCount > 0 && folderCount > 0) {
                typeText = `${bookmarkCount}个书签, ${folderCount}个分类`;
            } else if (bookmarkCount > 0) {
                typeText = `${bookmarkCount}个书签`;
            } else if (folderCount > 0) {
                typeText = `${folderCount}个分类`;
            } else {
                typeText = '无';
            }
            document.getElementById('selectedType').textContent = typeText;
            
            if (count > 0) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        }
        
        function updateBatchTargets() {
            const selects = ['batchMoveTarget', 'editBookmarkFolder', 'bookmarkFolder'];
            const folders = Object.keys(bookmarkData.folders || {});
            
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '';
                
                if (id === 'batchMoveTarget') {
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = '';
                    defaultOpt.textContent = '移动到...';
                    select.appendChild(defaultOpt);
                }
                
                folders.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f;
                    option.textContent = f;
                    select.appendChild(option);
                });
                
                if (currentVal && folders.includes(currentVal)) {
                    select.value = currentVal;
                }
            });
        }
        
        // ========== 批量操作 ==========
        function batchMove() {
            const target = document.getElementById('batchMoveTarget').value;
            if (!target) {
                showToast('请选择目标分类', 'warning');
                return;
            }
            
            if (selectedItems.size === 0) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            if (!confirm(`确定将 ${selectedItems.size} 项移动到 "${target}" 吗？`)) return;
            
            const items = Array.from(selectedItems);
            let movedBookmarks = 0;
            let movedFolders = 0;
            
            items.forEach(id => {
                if (id.startsWith('bookmark|')) {
                    const [, folder, index] = id.split('|');
                    const idx = parseInt(index);
                    let bookmark = null;
                    
                    if (folder === '📌 未分类') {
                        bookmark = bookmarkData.uncategorized[idx];
                        if (bookmark) {
                            bookmarkData.uncategorized.splice(idx, 1);
                        }
                    } else if (bookmarkData.folders[folder]) {
                        bookmark = bookmarkData.folders[folder][idx];
                        if (bookmark) {
                            bookmarkData.folders[folder].splice(idx, 1);
                        }
                    }
                    
                    if (bookmark) {
                        if (!bookmarkData.folders[target]) {
                            bookmarkData.folders[target] = [];
                        }
                        bookmarkData.folders[target].push(bookmark);
                        movedBookmarks++;
                    }
                } else if (id.startsWith('folder|')) {
                    const folderName = id.replace('folder|', '');
                    if (folderName === target) {
                        showToast(`不能将分类移动到自身`, 'warning');
                        return;
                    }
                    if (bookmarkData.folders[folderName]) {
                        const bookmarks = bookmarkData.folders[folderName];
                        if (!bookmarkData.folders[target]) {
                            bookmarkData.folders[target] = [];
                        }
                        bookmarkData.folders[target] = bookmarkData.folders[target].concat(bookmarks);
                        delete bookmarkData.folders[folderName];
                        movedFolders++;
                    }
                }
            });
            
            selectedItems.clear();
            bookmarkData.updatedAt = new Date().toISOString();
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            
            let msg = `✅ 成功移动`;
            if (movedBookmarks > 0) msg += ` ${movedBookmarks} 个书签`;
            if (movedFolders > 0) msg += ` ${movedFolders} 个分类`;
            msg += ` 到 "${target}"`;
            showToast(msg, 'success');
        }
        
        function batchDelete() {
            if (selectedItems.size === 0) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            let bookmarkCount = 0;
            let folderCount = 0;
            selectedItems.forEach(id => {
                if (id.startsWith('bookmark|')) bookmarkCount++;
                else if (id.startsWith('folder|')) folderCount++;
            });
            
            let msg = `⚠️ 确定要删除 `;
            if (bookmarkCount > 0) msg += `${bookmarkCount} 个书签`;
            if (bookmarkCount > 0 && folderCount > 0) msg += ` 和 `;
            if (folderCount > 0) msg += `${folderCount} 个分类`;
            msg += ` 吗？此操作不可撤销！`;
            
            if (!confirm(msg)) return;
            
            const items = Array.from(selectedItems);
            let deletedBookmarks = 0;
            let deletedFolders = 0;
            
            const bookmarkItems = items.filter(id => id.startsWith('bookmark|'));
            const folderItems = items.filter(id => id.startsWith('folder|'));
            
            const bookmarkGroups = {};
            bookmarkItems.forEach(id => {
                const [, folder, index] = id.split('|');
                if (!bookmarkGroups[folder]) bookmarkGroups[folder] = [];
                bookmarkGroups[folder].push(parseInt(index));
            });
            
            for (const [folder, indices] of Object.entries(bookmarkGroups)) {
                indices.sort((a, b) => b - a);
                indices.forEach(idx => {
                    if (folder === '📌 未分类') {
                        if (bookmarkData.uncategorized[idx]) {
                            bookmarkData.uncategorized.splice(idx, 1);
                            deletedBookmarks++;
                        }
                    } else if (bookmarkData.folders[folder]) {
                        if (bookmarkData.folders[folder][idx]) {
                            bookmarkData.folders[folder].splice(idx, 1);
                            deletedBookmarks++;
                        }
                    }
                });
            }
            
            folderItems.forEach(id => {
                const folderName = id.replace('folder|', '');
                if (bookmarkData.folders[folderName]) {
                    deletedFolders += bookmarkData.folders[folderName].length;
                    delete bookmarkData.folders[folderName];
                }
            });
            
            selectedItems.clear();
            bookmarkData.updatedAt = new Date().toISOString();
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            
            let resultMsg = `✅ 成功删除`;
            if (deletedBookmarks > 0) resultMsg += ` ${deletedBookmarks} 个书签`;
            if (deletedFolders > 0) resultMsg += ` ${deletedFolders} 个分类`;
            showToast(resultMsg, 'success');
        }
        
        // ========== 单个移动 ==========
        function moveSingle(folder, index) {
            selectedItems.clear();
            selectedItems.add(`bookmark|${folder}|${index}`);
            updateSelectionUI();
            document.getElementById('batchMoveTarget').focus();
            showToast('📂 请选择目标分类后点击"移动"', 'info');
            document.getElementById('batchMoveTarget').scrollIntoView({ behavior: 'smooth' });
        }
        
        function moveFolder(folderName) {
            selectedItems.clear();
            selectedItems.add(`folder|${folderName}`);
            updateSelectionUI();
            document.getElementById('batchMoveTarget').focus();
            showToast(`📂 分类 "${folderName}" 已选中，请选择目标分类后点击"移动"`, 'info');
            document.getElementById('batchMoveTarget').scrollIntoView({ behavior: 'smooth' });
        }
        
        // ========== 树操作 ==========
        function toggleNode(el) {
            const children = el.parentElement.querySelector('.children');
            const icon = el.querySelector('.toggle-icon');
            if (children) {
                children.classList.toggle('expanded');
                icon.classList.toggle('expanded');
            }
        }
        
        function expandAll() {
            document.querySelectorAll('.tree-node .children').forEach(c => c.classList.add('expanded'));
            document.querySelectorAll('.tree-node .toggle-icon').forEach(c => c.classList.add('expanded'));
        }
        
        function collapseAll() {
            document.querySelectorAll('.tree-node .children').forEach(c => c.classList.remove('expanded'));
            document.querySelectorAll('.tree-node .toggle-icon').forEach(c => c.classList.remove('expanded'));
            document.querySelector('.root-node .children')?.classList.add('expanded');
            document.querySelector('.root-node .toggle-icon')?.classList.add('expanded');
        }
        
        // ========== 统计 ==========
        function updateStats() {
            let total = 0;
            let folders = Object.keys(bookmarkData.folders || {}).length;
            
            if (bookmarkData.folders) {
                for (const folder of Object.values(bookmarkData.folders)) {
                    total += folder.length;
                }
            }
            if (bookmarkData.uncategorized) {
                total += bookmarkData.uncategorized.length;
            }
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('folderCount').textContent = folders;
            document.getElementById('lastUpdate').textContent = bookmarkData.updatedAt ? 
                new Date(bookmarkData.updatedAt).toLocaleString() : '从未';
        }
        
        function updateFolderSelects() {
            const selects = ['bookmarkFolder', 'editBookmarkFolder'];
            const folders = Object.keys(bookmarkData.folders || {});
            
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '';
                folders.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f;
                    option.textContent = f;
                    select.appendChild(option);
                });
                if (currentVal && folders.includes(currentVal)) {
                    select.value = currentVal;
                }
            });
        }
        
        // ========== 书签CRUD ==========
        function showAddBookmark() {
            document.getElementById('bookmarkTitle').value = '';
            document.getElementById('bookmarkUrl').value = '';
            document.getElementById('bookmarkTags').value = '';
            updateFolderSelects();
            openModal('addBookmarkModal');
        }
        
        function addBookmark() {
            const title = document.getElementById('bookmarkTitle').value.trim();
            const url = document.getElementById('bookmarkUrl').value.trim();
            const folder = document.getElementById('bookmarkFolder').value;
            const tags = document.getElementById('bookmarkTags').value.split(',').map(t => t.trim()).filter(t => t);
            
            if (!title || !url) { showToast('请填写标题和URL', 'error'); return; }
            if (!url.match(/^https?:\/\/.+/)) { showToast('请输入有效的URL', 'error'); return; }
            
            const bookmark = { title, url, tags };
            
            if (folder && bookmarkData.folders[folder]) {
                bookmarkData.folders[folder].push(bookmark);
            } else {
                bookmarkData.uncategorized.push(bookmark);
            }
            
            bookmarkData.updatedAt = new Date().toISOString();
            closeModal('addBookmarkModal');
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('✅ 书签添加成功', 'success');
        }
        
        function editBookmark(folder, index) {
            let bookmark;
            if (folder === '📌 未分类') {
                bookmark = bookmarkData.uncategorized[index];
            } else if (bookmarkData.folders[folder]) {
                bookmark = bookmarkData.folders[folder][index];
            }
            if (!bookmark) return;
            
            editTarget = { folder, index };
            document.getElementById('editBookmarkTitle').value = bookmark.title || '';
            document.getElementById('editBookmarkUrl').value = bookmark.url || '';
            document.getElementById('editBookmarkTags').value = (bookmark.tags || []).join(', ');
            updateFolderSelects();
            document.getElementById('editBookmarkFolder').value = folder === '📌 未分类' ? '' : folder;
            openModal('editBookmarkModal');
        }
        
        function saveEditBookmark() {
            const title = document.getElementById('editBookmarkTitle').value.trim();
            const url = document.getElementById('editBookmarkUrl').value.trim();
            const folder = document.getElementById('editBookmarkFolder').value;
            const tags = document.getElementById('editBookmarkTags').value.split(',').map(t => t.trim()).filter(t => t);
            
            if (!title || !url) { showToast('请填写完整信息', 'error'); return; }
            
            const { folder: oldFolder, index } = editTarget;
            let bookmark;
            
            if (oldFolder === '📌 未分类') {
                bookmark = bookmarkData.uncategorized[index];
                bookmarkData.uncategorized.splice(index, 1);
            } else if (bookmarkData.folders[oldFolder]) {
                bookmark = bookmarkData.folders[oldFolder][index];
                bookmarkData.folders[oldFolder].splice(index, 1);
            }
            if (!bookmark) return;
            
            bookmark.title = title;
            bookmark.url = url;
            bookmark.tags = tags;
            
            if (folder && bookmarkData.folders[folder]) {
                bookmarkData.folders[folder].push(bookmark);
            } else {
                bookmarkData.uncategorized.push(bookmark);
            }
            
            bookmarkData.updatedAt = new Date().toISOString();
            closeModal('editBookmarkModal');
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('✅ 更新成功', 'success');
        }
        
        function deleteBookmark(folder, index) {
            if (!confirm('确定要删除这个书签吗？')) return;
            
            if (folder === '📌 未分类') {
                bookmarkData.uncategorized.splice(index, 1);
            } else if (bookmarkData.folders[folder]) {
                bookmarkData.folders[folder].splice(index, 1);
            }
            
            bookmarkData.updatedAt = new Date().toISOString();
            selectedItems.delete(`bookmark|${folder}|${index}`);
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('已删除', 'success');
        }
        
        // ========== 分类管理 ==========
        function showAddFolder() {
            document.getElementById('folderName').value = '';
            openModal('addFolderModal');
        }
        
        function addFolder() {
            const name = document.getElementById('folderName').value.trim();
            if (!name) { showToast('请输入分类名称', 'error'); return; }
            if (bookmarkData.folders[name]) { showToast('分类已存在', 'error'); return; }
            
            bookmarkData.folders[name] = [];
            bookmarkData.updatedAt = new Date().toISOString();
            closeModal('addFolderModal');
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('✅ 分类创建成功', 'success');
        }
        
        function renameFolder(oldName) {
            const newName = prompt(`将 "${oldName}" 重命名为:`, oldName);
            if (!newName || newName === oldName) return;
            if (bookmarkData.folders[newName]) { showToast('分类名称已存在', 'error'); return; }
            
            bookmarkData.folders[newName] = bookmarkData.folders[oldName];
            delete bookmarkData.folders[oldName];
            bookmarkData.updatedAt = new Date().toISOString();
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('✅ 重命名成功', 'success');
        }
        
        function deleteFolder(folderName) {
            if (!confirm(`确定要删除分类 "${folderName}" 及其所有书签吗？`)) return;
            delete bookmarkData.folders[folderName];
            bookmarkData.updatedAt = new Date().toISOString();
            selectedItems.delete(`folder|${folderName}`);
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('已删除分类', 'success');
        }
        
        // ========== 导入HTML ==========
        function importHTML() {
            document.getElementById('htmlFileInput').value = '';
            document.getElementById('htmlContent').value = '';
            document.getElementById('importPreview').style.display = 'none';
            document.getElementById('importMerge').checked = true;
            importPreviewData = null;
            openModal('importModal');
        }
        
        function previewHTMLImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('htmlContent').value = e.target.result;
                parseHTMLContent(e.target.result);
            };
            reader.readAsText(file);
        }
        
        document.getElementById('htmlContent').addEventListener('input', function() {
            if (this.value.trim()) {
                parseHTMLContent(this.value);
            } else {
                document.getElementById('importPreview').style.display = 'none';
                importPreviewData = null;
            }
        });
        
        function parseHTMLContent(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const result = { folders: {}, uncategorized: [] };
            let currentFolder = null;
            let currentBookmarks = [];
            
            const dts = doc.querySelectorAll('DT');
            dts.forEach(dt => {
                const h3 = dt.querySelector('H3');
                if (h3) {
                    if (currentFolder && currentBookmarks.length > 0) {
                        if (!result.folders[currentFolder]) result.folders[currentFolder] = [];
                        result.folders[currentFolder] = result.folders[currentFolder].concat(currentBookmarks);
                    }
                    currentFolder = h3.textContent.trim();
                    currentBookmarks = [];
                    return;
                }
                const a = dt.querySelector('A');
                if (a) {
                    const href = a.getAttribute('HREF');
                    if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                        currentBookmarks.push({
                            title: a.textContent.trim() || href,
                            url: href,
                            tags: []
                        });
                    }
                }
            });
            
            if (currentFolder && currentBookmarks.length > 0) {
                if (!result.folders[currentFolder]) result.folders[currentFolder] = [];
                result.folders[currentFolder] = result.folders[currentFolder].concat(currentBookmarks);
            }
            
            if (Object.keys(result.folders).length === 0) {
                const links = doc.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                        result.uncategorized.push({
                            title: link.textContent.trim() || href,
                            url: href,
                            tags: []
                        });
                    }
                });
            }
            
            importPreviewData = result;
            showImportPreview(result);
        }
        
        function showImportPreview(data) {
            const preview = document.getElementById('importPreview');
            preview.style.display = 'block';
            let total = 0;
            let html = '';
            
            if (data.folders) {
                for (const [folder, bookmarks] of Object.entries(data.folders)) {
                    if (bookmarks.length === 0) continue;
                    total += bookmarks.length;
                    html += `<div class="folder-group"><div class="folder-name">📁 ${folder} (${bookmarks.length})</div>`;
                    bookmarks.slice(0, 10).forEach(b => {
                        html += `<div class="item">📌 ${b.title || b.url} <span class="url">${b.url}</span></div>`;
                    });
                    if (bookmarks.length > 10) {
                        html += `<div class="item" style="color:#a0aec0;">... 还有 ${bookmarks.length - 10} 个</div>`;
                    }
                    html += `</div>`;
                }
            }
            
            if (data.uncategorized && data.uncategorized.length > 0) {
                total += data.uncategorized.length;
                html += `<div class="folder-group"><div class="folder-name">📌 未分类 (${data.uncategorized.length})</div>`;
                data.uncategorized.slice(0, 10).forEach(b => {
                    html += `<div class="item">📌 ${b.title || b.url} <span class="url">${b.url}</span></div>`;
                });
                if (data.uncategorized.length > 10) {
                    html += `<div class="item" style="color:#a0aec0;">... 还有 ${data.uncategorized.length - 10} 个</div>`;
                }
                html += `</div>`;
            }
            
            preview.innerHTML = `
                <div style="margin-bottom:6px;font-weight:600;color:#2d3748;">
                    📊 共 ${total} 个书签，${Object.keys(data.folders || {}).length} 个分类
                </div>
                ${html}
            `;
        }
        
        function confirmImportHTML() {
            if (!importPreviewData) { showToast('请先导入HTML内容', 'error'); return; }
            
            const merge = document.getElementById('importMerge').checked;
            if (!merge) {
                bookmarkData = { folders: {}, uncategorized: [], updatedAt: new Date().toISOString() };
            }
            
            if (importPreviewData.folders) {
                for (const [folder, bookmarks] of Object.entries(importPreviewData.folders)) {
                    if (bookmarks.length === 0) continue;
                    if (!bookmarkData.folders[folder]) bookmarkData.folders[folder] = [];
                    bookmarkData.folders[folder] = bookmarkData.folders[folder].concat(bookmarks);
                }
            }
            
            if (importPreviewData.uncategorized && importPreviewData.uncategorized.length > 0) {
                bookmarkData.uncategorized = bookmarkData.uncategorized.concat(importPreviewData.uncategorized);
            }
            
            bookmarkData.updatedAt = new Date().toISOString();
            closeModal('importModal');
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            const total = countTotal(importPreviewData);
            showToast(`✅ 成功导入 ${total} 个书签`, 'success');
        }
        
        function countTotal(data) {
            let count = 0;
            if (data.folders) {
                for (const folder of Object.values(data.folders)) count += folder.length;
            }
            if (data.uncategorized) count += data.uncategorized.length;
            return count;
        }
        
        // ========== 导出JSON ==========
        function exportJSON() {
            const data = JSON.stringify(bookmarkData, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookmarks_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 JSON导出成功！', 'success');
        }
        
        // ========== 导出HTML ==========
        function exportHTML() {
            let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>我的书签</title>
            <style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f7fafc;}
            h1{color:#2d3748;border-bottom:3px solid #667eea;padding-bottom:12px;}
            .folder{margin:30px 0;}.folder-title{font-size:20px;font-weight:600;color:#2d3748;margin-bottom:12px;}
            .bookmark{padding:10px 14px;margin:6px 0;background:white;border-radius:8px;}
            .bookmark a{color:#667eea;text-decoration:none;font-weight:500;}
            .bookmark .url{color:#a0aec0;font-size:13px;margin-left:12px;}
            .footer{margin-top:40px;color:#a0aec0;text-align:center;font-size:13px;}</style>
            </head><body><h1>📚 我的书签</h1><p style="color:#718096;">导出时间: ${new Date().toLocaleString()}</p><hr>`;
            
            if (bookmarkData.folders) {
                for (const [folder, bookmarks] of Object.entries(bookmarkData.folders)) {
                    if (bookmarks.length === 0) continue;
                    html += `<div class="folder"><div class="folder-title">📁 ${folder}</div>`;
                    bookmarks.forEach(b => {
                        html += `<div class="bookmark"><a href="${b.url}" target="_blank">${b.title || b.url}</a><span class="url">${b.url}</span></div>`;
                    });
                    html += `</div>`;
                }
            }
            
            if (bookmarkData.uncategorized && bookmarkData.uncategorized.length > 0) {
                html += `<div class="folder"><div class="folder-title">📌 未分类</div>`;
                bookmarkData.uncategorized.forEach(b => {
                    html += `<div class="bookmark"><a href="${b.url}" target="_blank">${b.title || b.url}</a><span class="url">${b.url}</span></div>`;
                });
                html += `</div>`;
            }
            
            html += `<div class="footer">共 ${document.getElementById('totalCount').textContent} 个书签</div></body></html>`;
            
            const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookmarks_${new Date().toISOString().split('T')[0]}.html`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 HTML导出成功！', 'success');
        }
        
        // ========== Gist同步（修复版） ==========
        async function syncToGist() {
            const cfg = getConfig();
            if (!cfg.token) { 
                showToast('请先配置Token', 'error'); 
                toggleConfig(); 
                return; 
            }
            
            try {
                // 使用固定的文件名 bookmarks.json
                const data = JSON.stringify(bookmarkData, null, 2);
                
                let url = 'https://api.github.com/gists';
                let method = 'POST';
                let body = {
                    description: `书签备份 - ${new Date().toLocaleString()}`,
                    public: false,
                    files: {
                        [GIST_FILENAME]: { content: data }  // 使用固定文件名
                    }
                };
                
                // 如果有Gist ID，更新现有Gist
                if (cfg.gistId) {
                    url = `https://api.github.com/gists/${cfg.gistId}`;
                    method = 'PATCH';
                    body = {
                        description: `书签更新 - ${new Date().toLocaleString()}`,
                        files: {
                            [GIST_FILENAME]: { content: data }  // 保持文件名不变
                        }
                    };
                }
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP ${response.status}`);
                }
                
                const result = await response.json();
                
                // 如果是新创建的Gist，保存ID
                if (!cfg.gistId) {
                    config.gistId = result.id;
                    document.getElementById('configGistId').value = result.id;
                    localStorage.setItem('gistConfig', JSON.stringify(config));
                    updateConfigStatus();
                    showToast(`✅ 新Gist创建成功！ID: ${result.id}`, 'success');
                } else {
                    showToast(`✅ Gist更新成功！ID: ${result.id}`, 'success');
                }
                
                // 复制ID到剪贴板
                if (navigator.clipboard) {
                    try {
                        await navigator.clipboard.writeText(result.id);
                        showToast('📋 Gist ID已复制到剪贴板', 'info');
                    } catch (e) {}
                }
                
                // 显示Gist中的文件列表（调试用）
                console.log('📁 Gist文件:', Object.keys(result.files));
                
            } catch (error) {
                console.error('上传失败:', error);
                showToast('❌ 上传失败: ' + error.message, 'error');
            }
        }
        
        async function syncFromGist() {
            const cfg = getConfig();
            if (!cfg.token) { 
                showToast('请先配置Token', 'error'); 
                toggleConfig(); 
                return; 
            }
            
            let gistId = cfg.gistId;
            if (!gistId) {
                gistId = prompt('请输入Gist ID:');
                if (!gistId) return;
            }
            
            try {
                showToast('📥 正在从Gist导入...', 'info');
                
                const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                    headers: {
                        'Authorization': `token ${cfg.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP ${response.status}`);
                }
                
                const gist = await response.json();
                
                // 查找 bookmarks.json 文件
                let data = null;
                let foundFile = null;
                
                // 优先查找 bookmarks.json
                if (gist.files[GIST_FILENAME]) {
                    foundFile = GIST_FILENAME;
                    data = JSON.parse(gist.files[GIST_FILENAME].content);
                } else {
                    // 如果没有找到，尝试找任意JSON文件
                    for (const [filename, file] of Object.entries(gist.files)) {
                        if (filename.endsWith('.json')) {
                            foundFile = filename;
                            data = JSON.parse(file.content);
                            break;
                        }
                    }
                }
                
                if (!data) {
                    throw new Error('未找到JSON数据文件，请确保Gist中包含 bookmarks.json');
                }
                
                // 验证数据格式
                if (!data.folders && !data.uncategorized) {
                    // 尝试转换格式
                    if (typeof data === 'object' && !Array.isArray(data)) {
                        let converted = { folders: {}, uncategorized: [] };
                        let hasData = false;
                        
                        for (const [key, value] of Object.entries(data)) {
                            if (Array.isArray(value) && value.length > 0) {
                                const hasUrl = value.some(item => item.url || item.link);
                                if (hasUrl) {
                                    converted.folders[key] = value.map(item => ({
                                        title: item.title || item.name || item.label || item.url || '未命名',
                                        url: item.url || item.link || '',
                                        tags: item.tags || item.tag || []
                                    })).filter(b => b.url && b.url.match(/^https?:\/\/.+/));
                                    if (converted.folders[key].length > 0) hasData = true;
                                }
                            }
                        }
                        
                        if (hasData) {
                            data = converted;
                        }
                    }
                }
                
                // 再次验证
                let total = 0;
                if (data.folders) {
                    for (const folder of Object.values(data.folders)) {
                        total += folder.length;
                    }
                }
                if (data.uncategorized) {
                    total += data.uncategorized.length;
                }
                
                if (total === 0) {
                    throw new Error('数据为空或格式无效');
                }
                
                if (!confirm(`📊 找到 ${total} 个书签，${Object.keys(data.folders || {}).length} 个分类\n\n确定导入吗？将替换当前所有数据！`)) {
                    return;
                }
                
                // 导入数据
                bookmarkData = data;
                bookmarkData.updatedAt = new Date().toISOString();
                
                // 如果Gist ID还没保存，保存它
                if (!cfg.gistId) {
                    config.gistId = gistId;
                    document.getElementById('configGistId').value = gistId;
                    localStorage.setItem('gistConfig', JSON.stringify(config));
                    updateConfigStatus();
                }
                
                // 刷新界面
                selectedItems.clear();
                renderTree();
                updateStats();
                updateFolderSelects();
                updateBatchTargets();
                saveToLocal();
                
                showToast(`✅ 导入成功！共 ${total} 个书签，来自文件: ${foundFile || 'bookmarks.json'}`, 'success');
                
            } catch (error) {
                console.error('导入失败:', error);
                showToast('❌ 导入失败: ' + error.message, 'error');
            }
        }
        
        // ========== 清空 ==========
        function clearAll() {
            if (!confirm('⚠️ 确定要清空所有书签吗？')) return;
            bookmarkData = { folders: {}, uncategorized: [], updatedAt: new Date().toISOString() };
            selectedItems.clear();
            renderTree();
            updateStats();
            updateFolderSelects();
            updateBatchTargets();
            saveToLocal();
            showToast('已清空所有书签', 'warning');
        }
        
        // ========== 搜索 ==========
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.bookmark-item');
            
            items.forEach(item => {
                const title = item.querySelector('.bookmark-title a')?.textContent?.toLowerCase() || '';
                const url = item.querySelector('.bookmark-url a')?.textContent?.toLowerCase() || '';
                const match = title.includes(keyword) || url.includes(keyword);
                item.style.display = match ? '' : 'none';
            });
            
            document.querySelectorAll('.tree-node .children').forEach(children => {
                const items = children.querySelectorAll('.bookmark-item');
                const visible = Array.from(items).some(item => item.style.display !== 'none');
                const parentNode = children.closest('.tree-node');
                if (parentNode) {
                    parentNode.style.display = visible ? '' : 'none';
                    if (visible) {
                        children.classList.add('expanded');
                        const icon = parentNode.querySelector('.toggle-icon');
                        if (icon) icon.classList.add('expanded');
                    }
                }
            });
        });
        
        // ========== UI工具 ==========
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // ========== 快捷键 ==========
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.active').forEach(modal => modal.classList.remove('active'));
            }
        });
        
        console.log('🌳 树形书签管理器已加载');
        console.log('📁 使用固定文件名: ' + GIST_FILENAME);
        console.log('💡 上传Gist时使用统一文件名，导入时优先读取 bookmarks.json');
    </script>
