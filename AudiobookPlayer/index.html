<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能音频伴侣 | 云端同步播放器 (自动Token)</title>
    <!-- 优雅字体与现代化样式 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #f0f4fc 0%, #e6edf7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }

        /* 主卡片 */
        .player-card {
            max-width: 580px;
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.02);
            padding: 1.8rem 2rem 2.2rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.6);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1A2A3F, #2C4A6E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sub {
            color: #4a627a;
            font-size: 0.8rem;
            font-weight: 450;
            border-left: 3px solid #3b82f6;
            padding-left: 0.7rem;
            margin-bottom: 1.5rem;
        }

        /* 文件上传区 */
        .upload-area {
            background: #f9fafc;
            border-radius: 2rem;
            border: 1.5px dashed #cbd5e1;
            padding: 0.8rem 1rem;
            transition: all 0.2s;
            margin-bottom: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .file-label {
            background: #1f2a3e;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .file-label:hover { background: #2c3e50; transform: scale(0.97);}
        #file-input { display: none; }
        .file-name {
            font-size: 0.8rem;
            color: #2c3e50;
            background: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            max-width: 210px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 元信息 */
        .track-info {
            text-align: center;
            margin: 0.5rem 0 0.8rem;
        }
        .track-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0f172a;
        }
        .track-duration {
            font-size: 0.75rem;
            color: #5f6c84;
            margin-top: 5px;
        }

        /* 播放控件 */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
        .ctrl-btn {
            background: white;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1.4rem;
            color: #1f2a3e;
            box-shadow: 0 8px 18px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.02);
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active { transform: scale(0.96); background: #f0f2f5; }
        .play-btn {
            background: #1f2a3e;
            color: white;
            width: 68px;
            height: 68px;
            font-size: 1.7rem;
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.2);
        }
        .play-btn:hover { background: #2c3e50; }

        /* 进度条 */
        .progress-section {
            margin: 0.5rem 0 1rem;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #e2e8f0;
            border-radius: 50px;
            height: 6px;
            width: 100%;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 6px;
            border-radius: 50px;
            transition: width 0.05s linear;
        }

        /* 其他功能栏: 书签 & gist */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin: 1.4rem 0 1rem;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.7);
            border: 1px solid #cddfe7;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: #1e293b;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .secondary-btn i { font-size: 0.8rem; }
        .secondary-btn:hover { background: white; border-color: #3b82f6; color: #3b82f6; }

        .gist-area {
            margin-top: 1rem;
            background: #f1f5f9;
            border-radius: 1.8rem;
            padding: 0.8rem 1rem;
        }
        .gist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .gist-url-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            font-size: 0.7rem;
            background: white;
            font-family: monospace;
        }
        .token-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .token-input {
            flex: 2;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            font-size: 0.7rem;
            background: #fffef5;
            font-family: monospace;
        }
        .tiny-btn {
            background: #e2e8f0;
            border: none;
            padding: 6px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
        }
        .status-msg {
            font-size: 0.7rem;
            color: #2c5a2e;
            margin-top: 6px;
            word-break: break-all;
        }
        .bookmark-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 8px;
        }
        .bookmark-chip {
            background: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.1s;
            border: 1px solid #e2e8f0;
        }
        .bookmark-chip:hover { background: #eef2ff; border-color: #3b82f6; transform: translateY(-1px);}
        hr { margin: 0.5rem 0; opacity: 0.3;}

        @media (max-width: 500px) {
            .player-card { padding: 1.3rem; }
            .ctrl-btn { width: 44px; height: 44px; font-size: 1.2rem; }
            .play-btn { width: 56px; height: 56px; }
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

<div class="player-card" id="app">
    <h1><i class="fas fa-headphones"></i> 灵韵·云笺</h1>
    <div class="sub">支持 MP3 / M4A / OPUS · 智能断点回溯 · 自动Token保存</div>

    <!-- 音频上传 -->
    <div class="upload-area">
        <label class="file-label" for="file-input"><i class="fas fa-cloud-upload-alt"></i> 选择音频</label>
        <input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.opus,.ogg,.wav">
        <span class="file-name" id="filename-display">未选择文件</span>
    </div>

    <!-- 曲目信息 -->
    <div class="track-info">
        <div class="track-title" id="track-title">🎵 未加载音频</div>
        <div class="track-duration" id="track-duration">--:-- / --:--</div>
    </div>

    <!-- 音频元素 (隐藏但控制播放) -->
    <audio id="audio-player" preload="metadata" style="display: none;"></audio>

    <!-- 中央控制按钮 -->
    <div class="player-controls">
        <button class="ctrl-btn" id="rewindBtn" title="后退5秒"><i class="fas fa-backward-step"></i> 5s</button>
        <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="forwardBtn" title="前进5秒"><i class="fas fa-forward-step"></i> 5s</button>
    </div>

    <!-- 进度条 -->
    <div class="progress-section">
        <div class="time-row">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
        </div>
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- 快捷操作栏 -->
    <div class="action-bar">
        <button class="secondary-btn" id="addBookmarkBtn"><i class="fas fa-bookmark"></i> 添加书签</button>
        <button class="secondary-btn" id="saveProgressGistBtn"><i class="fab fa-github"></i> 保存进度到 Gist</button>
        <button class="secondary-btn" id="loadFromGistBtn"><i class="fas fa-sync-alt"></i> 从 Gist 恢复</button>
    </div>

    <!-- 展示已有书签 -->
    <div id="bookmarkContainer">
        <div style="font-size:0.7rem; font-weight:500; margin-bottom:6px;"><i class="fas fa-tags"></i> 书签列表 (点击跳转)</div>
        <div class="bookmark-list" id="bookmarkList"></div>
    </div>

    <!-- GIST 同步区 + Token保存 -->
    <div class="gist-area">
        <div class="gist-header">
            <span style="font-size:0.75rem; font-weight:500;"><i class="fab fa-github"></i> GitHub Gist 同步</span>
            <input type="text" id="gistIdInput" class="gist-url-input" placeholder="输入 Gist ID 或完整 URL ...">
        </div>
        <div class="token-row">
            <input type="password" id="githubTokenInput" class="token-input" placeholder="GitHub Token (仅存于本机，不会上传其他地方)" autocomplete="off">
            <button id="saveTokenBtn" class="tiny-btn"><i class="fas fa-save"></i> 记住Token</button>
            <button id="clearTokenBtn" class="tiny-btn"><i class="fas fa-trash-alt"></i> 清除</button>
        </div>
        <div id="gistStatus" class="status-msg">⚡ 首次使用请在下框粘贴Token并点击“记住Token”，之后自动使用。Token仅存储在此设备。</div>
    </div>
</div>

<script>
    /********** 核心要素 **********/
    const audio = document.getElementById('audio-player');
    const fileInput = document.getElementById('file-input');
    const fileNameSpan = document.getElementById('filename-display');
    const trackTitleEl = document.getElementById('track-title');
    const durationDisplay = document.getElementById('track-duration');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBg = document.getElementById('progressBarBg');
    const currentTimeSpan = document.getElementById('current-time');
    const totalTimeSpan = document.getElementById('total-time');
    const addBookmarkBtn = document.getElementById('addBookmarkBtn');
    const bookmarkListDiv = document.getElementById('bookmarkList');
    const saveProgressGistBtn = document.getElementById('saveProgressGistBtn');
    const loadFromGistBtn = document.getElementById('loadFromGistBtn');
    const gistIdInput = document.getElementById('gistIdInput');
    const githubTokenInput = document.getElementById('githubTokenInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');
    const clearTokenBtn = document.getElementById('clearTokenBtn');
    const gistStatusDiv = document.getElementById('gistStatus');

    // 状态变量
    let currentFile = null;          
    let currentBookmarks = [];       
    let isPlaying = false;
    let pendingRewindOnPlay = false;  
    let skipNextRewindMark = false;   

    // Token 存储
    function saveTokenToLocal(token) {
        if(token && token.trim()) {
            localStorage.setItem('gh_gist_token', token.trim());
            return true;
        }
        return false;
    }
    function getStoredToken() {
        return localStorage.getItem('gh_gist_token') || '';
    }
    function clearStoredToken() {
        localStorage.removeItem('gh_gist_token');
        githubTokenInput.value = '';
        gistStatusDiv.innerHTML = '✅ Token已清除，如需使用请重新输入并保存。';
        setTimeout(()=>{
            if(gistStatusDiv.innerHTML.includes('清除')) 
                gistStatusDiv.innerHTML = '⚡ Token已清空，gist同步需要Token。';
        }, 2000);
    }

    // 界面加载时填充已有的token
    function loadTokenToInput() {
        const stored = getStoredToken();
        if(stored) {
            githubTokenInput.value = stored;
            gistStatusDiv.innerHTML = '🔑 Token已加载（隐藏），可正常使用Gist同步。';
        } else {
            gistStatusDiv.innerHTML = '📌 未存储Token，请在下框粘贴GitHub Token并点击“记住Token”后再使用同步。';
        }
    }
    saveTokenBtn.addEventListener('click', () => {
        const token = githubTokenInput.value.trim();
        if(!token) {
            alert('请输入Token');
            return;
        }
        saveTokenToLocal(token);
        gistStatusDiv.innerHTML = '✅ Token已保存至本设备，之后保存/恢复将自动使用。';
        setTimeout(()=>{
            if(gistStatusDiv.innerHTML.includes('已保存')) gistStatusDiv.innerHTML = '🔐 Token已就绪，可点击保存或恢复。';
        }, 2000);
    });
    clearTokenBtn.addEventListener('click', () => {
        clearStoredToken();
    });

    // 获取有效token（优先使用存储的，否则使用输入框当前值, 但输入框当前值不自动记忆）
    function getActiveToken() {
        let token = getStoredToken();
        if(!token) {
            token = githubTokenInput.value.trim();
            if(token) {
                // 可以提示一次性使用
                gistStatusDiv.innerHTML = '⚠️ 当前Token未保存，建议点击“记住Token”避免重复输入。';
            }
        }
        return token;
    }

    // 标记停顿后退5秒逻辑
    function markStoppedForRewind() {
        if (!skipNextRewindMark) {
            pendingRewindOnPlay = true;
        }
        skipNextRewindMark = false;
    }
    function applyRewindBeforePlay() {
        if (pendingRewindOnPlay && !isNaN(audio.duration) && isFinite(audio.duration)) {
            let newTime = Math.max(0, audio.currentTime - 5);
            if (Math.abs(audio.currentTime - newTime) > 0.1) {
                audio.currentTime = newTime;
                updateProgressAndTime();
            }
            pendingRewindOnPlay = false;
        }
    }
    function clearPendingRewindAndSkip() {
        skipNextRewindMark = true;
        pendingRewindOnPlay = false;
    }

    audio.addEventListener('ended', () => {
        isPlaying = false;
        updatePlayPauseIcon();
        markStoppedForRewind();
    });
    audio.addEventListener('pause', () => {
        if (!audio.ended) markStoppedForRewind();
        isPlaying = false;
        updatePlayPauseIcon();
    });
    audio.addEventListener('play', () => {
        applyRewindBeforePlay();
        isPlaying = true;
        updatePlayPauseIcon();
    });

    // 格式化时间
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateProgressAndTime() {
        if (!isNaN(audio.duration) && isFinite(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            totalTimeSpan.innerText = formatTime(audio.duration);
            durationDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        } else {
            progressFill.style.width = '0%';
        }
    }

    audio.addEventListener('timeupdate', updateProgressAndTime);
    audio.addEventListener('loadedmetadata', () => {
        updateProgressAndTime();
        if (!isNaN(audio.duration)) {
            totalTimeSpan.innerText = formatTime(audio.duration);
            durationDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
            trackTitleEl.innerText = currentFile ? currentFile.name : "已加载音频";
        }
    });

    function togglePlayPause() {
        if (!audio.src || audio.src === '') {
            alert("请先上传音频文件");
            return;
        }
        if (audio.paused) {
            audio.play().catch(e => console.warn("播放失败", e));
        } else {
            audio.pause();
        }
    }

    function updatePlayPauseIcon() {
        const icon = playPauseBtn.querySelector('i');
        icon.className = audio.paused ? 'fas fa-play' : 'fas fa-pause';
    }

    function seekRelative(offsetSec) {
        if (!audio.duration || isNaN(audio.duration)) return;
        clearPendingRewindAndSkip();
        let newTime = audio.currentTime + offsetSec;
        newTime = Math.min(Math.max(0, newTime), audio.duration);
        audio.currentTime = newTime;
        updateProgressAndTime();
    }

    rewindBtn.addEventListener('click', () => seekRelative(-5));
    forwardBtn.addEventListener('click', () => seekRelative(5));
    playPauseBtn.addEventListener('click', togglePlayPause);

    progressBg.addEventListener('click', (e) => {
        if (!audio.duration || isNaN(audio.duration)) return;
        clearPendingRewindAndSkip();
        const rect = progressBg.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
        updateProgressAndTime();
    });

    function loadAudioFromFile(file) {
        if (!file) return;
        if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|opus|ogg|wav)$/i.test(file.name)) {
            alert("请选择有效的音频文件");
            return;
        }
        currentFile = file;
        fileNameSpan.innerText = file.name;
        trackTitleEl.innerText = file.name;
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.load();
        currentBookmarks = [];
        renderBookmarks();
        pendingRewindOnPlay = false;
        skipNextRewindMark = false;
        if(window.oldUrl) URL.revokeObjectURL(window.oldUrl);
        window.oldUrl = url;
        audio.addEventListener('loadedmetadata', function onMeta() {
            audio.removeEventListener('loadedmetadata', onMeta);
            updateProgressAndTime();
            loadBookmarksFromLocal();
        }, { once: true });
    }

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) loadAudioFromFile(e.target.files[0]);
    });

    function addBookmark() {
        if (!audio.src || isNaN(audio.duration)) {
            alert("请先加载音频文件");
            return;
        }
        const currentPos = audio.currentTime;
        const label = formatTime(currentPos);
        if(currentBookmarks.find(b => Math.abs(b.time - currentPos) < 0.5)) {
            alert("该位置已有书签");
            return;
        }
        currentBookmarks.push({ time: currentPos, label });
        currentBookmarks.sort((a,b) => a.time - b.time);
        renderBookmarks();
        saveBookmarksToLocal();
    }

    function renderBookmarks() {
        bookmarkListDiv.innerHTML = '';
        if (currentBookmarks.length === 0) {
            bookmarkListDiv.innerHTML = '<span style="font-size:0.7rem; color:#7f8c8d;">暂无书签，点击上方添加</span>';
            return;
        }
        currentBookmarks.forEach((bm) => {
            const chip = document.createElement('div');
            chip.className = 'bookmark-chip';
            chip.innerHTML = `<i class="fas fa-bookmark"></i> ${bm.label}`;
            chip.addEventListener('click', () => {
                clearPendingRewindAndSkip();
                audio.currentTime = bm.time;
                updateProgressAndTime();
            });
            bookmarkListDiv.appendChild(chip);
        });
    }

    function saveBookmarksToLocal() {
        if (currentFile && currentFile.name) {
            localStorage.setItem(`bm_${currentFile.name}`, JSON.stringify(currentBookmarks));
        }
    }
    function loadBookmarksFromLocal() {
        if (currentFile && currentFile.name) {
            const stored = localStorage.getItem(`bm_${currentFile.name}`);
            if (stored) {
                try { currentBookmarks = JSON.parse(stored); renderBookmarks(); } catch(e) {}
            } else { currentBookmarks = []; renderBookmarks(); }
        }
    }

    // Gist 操作使用存储的token
    async function saveToGist() {
        const token = getActiveToken();
        if (!token) {
            alert("请先填写并保存GitHub Token (点击“记住Token”)");
            return;
        }
        if (!currentFile) { alert("没有正在播放的音频"); return; }
        const progressData = {
            audioFileName: currentFile.name,
            currentTime: audio.currentTime,
            bookmarks: currentBookmarks,
            lastUpdated: new Date().toISOString()
        };
        const content = JSON.stringify(progressData, null, 2);
        const gistId = extractGistId(gistIdInput.value);
        try {
            let url = 'https://api.github.com/gists';
            let method = 'POST';
            let body = { description: `Audio Progress: ${currentFile.name}`, public: false, files: { "audio_progress.json": { content } } };
            if (gistId) {
                url = `https://api.github.com/gists/${gistId}`;
                method = 'PATCH';
                body = { files: { "audio_progress.json": { content } } };
            }
            const resp = await fetch(url, {
                method, headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error(`API错误 ${resp.status}`);
            const result = await resp.json();
            gistIdInput.value = result.id;
            gistStatusDiv.innerHTML = `✅ 保存成功！ Gist ID: ${result.id}`;
        } catch(err) { alert("保存失败: "+err.message); gistStatusDiv.innerHTML = `❌ 保存失败`; }
    }

    async function loadFromGist() {
        const token = getActiveToken();
        if (!token) { alert("请先保存Token后再恢复"); return; }
        const gistId = extractGistId(gistIdInput.value);
        if (!gistId) { alert("请输入Gist ID"); return; }
        try {
            const resp = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${token}` } });
            if (!resp.ok) throw new Error("获取失败");
            const gist = await resp.json();
            const fileContent = gist.files['audio_progress.json']?.content;
            if (!fileContent) throw new Error("未找到进度文件");
            const data = JSON.parse(fileContent);
            if (data.currentTime !== undefined && audio.duration) {
                clearPendingRewindAndSkip();
                audio.currentTime = Math.min(data.currentTime, audio.duration-0.1);
                updateProgressAndTime();
            }
            if (data.bookmarks) { currentBookmarks = data.bookmarks; renderBookmarks(); if(currentFile) saveBookmarksToLocal(); }
            gistStatusDiv.innerHTML = `✅ 从 Gist ${gistId} 恢复成功`;
        } catch(e) { alert("恢复失败 "+e.message); }
    }

    function extractGistId(input) {
        if(!input) return null;
        const match = input.match(/([a-fA-F0-9]{32})$/);
        if(match) return match[1];
        const parts = input.split('/');
        let last = parts[parts.length-1];
        if(last.includes('.')) last = last.split('.')[0];
        return last.length === 32 ? last : null;
    }

    addBookmarkBtn.addEventListener('click', addBookmark);
    saveProgressGistBtn.addEventListener('click', saveToGist);
    loadFromGistBtn.addEventListener('click', loadFromGist);
    loadTokenToInput();
</script>
</body>
</html>
