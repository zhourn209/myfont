<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>智能音频伴侣 | 智能排序 · 文件夹播放 · 云端同步</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #f0f4fc 0%, #e6edf7 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 1rem 1rem 5rem;
        }
        .player-card {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.6);
        }
        h1 { font-size: 1.5rem; font-weight: 600; background: linear-gradient(135deg, #1A2A3F, #2C4A6E); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .sub { color: #4a627a; font-size: 0.7rem; margin-bottom: 1rem; }
        .source-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }
        .primary-btn { background: #1f2a3e; color: white; border: none; padding: 8px 16px; border-radius: 40px; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .primary-btn:hover { background: #2c3e50; }
        .secondary-outline { background: white; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 40px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .playlist-section {
            background: rgba(255,255,255,0.6);
            border-radius: 1.2rem;
            margin: 0.8rem 0;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 1.2rem 1.2rem 0 0;
            font-size: 0.7rem;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 1;
        }
        .loop-mode { cursor: pointer; background: #e2e8f0; padding: 2px 8px; border-radius: 30px; font-size: 0.65rem; }
        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #eef2f6;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.05s;
        }
        .playlist-item.active { background: #dbeafe; color: #1e40af; }
        .playlist-item .track-num { width: 36px; color: #6c7a91; font-family: monospace; }
        .playlist-item .track-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
        .track-info { text-align: center; margin: 8px 0; }
        .track-title { font-weight: 700; font-size: 1rem; }
        .player-controls { display: flex; justify-content: center; gap: 1.5rem; margin: 1rem 0; }
        .ctrl-btn { background: white; border: none; width: 48px; height: 48px; border-radius: 60px; cursor: pointer; font-size: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .play-btn { background: #1f2a3e; color: white; width: 60px; height: 60px; font-size: 1.4rem; }
        .progress-section { margin: 0.5rem 0; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.65rem; margin-bottom: 4px; }
        .progress-bar-bg { background: #e2e8f0; border-radius: 50px; height: 5px; cursor: pointer; }
        .progress-fill { background: #3b82f6; width: 0%; height: 5px; border-radius: 50px; }
        .goto-section { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
        .goto-input { flex: 1; background: white; border: 1px solid #cbd5e1; border-radius: 40px; padding: 6px 12px; font-size: 0.7rem; }
        .timer-panel, .action-bar { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .timer-card, .gist-area { background: #f8fafc; border-radius: 1rem; padding: 8px 12px; flex: 1; }
        .bookmark-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
        .bookmark-chip { background: white; border-radius: 40px; padding: 2px 8px 2px 10px; font-size: 0.65rem; display: inline-flex; align-items: center; gap: 5px; border: 1px solid #e2e8f0; }
        .floating-player {
            position: fixed; bottom: 12px; left: 12px; right: 12px;
            background: rgba(30,41,59,0.94); backdrop-filter: blur(20px);
            border-radius: 60px; padding: 8px 14px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.2);
        }
        .float-info { color: white; font-size: 0.7rem; overflow: hidden; flex: 2; }
        .float-buttons { display: flex; gap: 8px; }
        .float-ctrl { background: rgba(255,255,255,0.2); border: none; width: 38px; height: 38px; border-radius: 40px; color: white; cursor: pointer; }
        .float-play { background: #3b82f6; width: 46px; height: 46px; }
        .tiny-btn { background: #e2e8f0; border: none; padding: 4px 10px; border-radius: 30px; font-size: 0.65rem; cursor: pointer; margin-left: 5px; }
        @media (max-width: 550px) { .player-card { padding: 1rem; } .ctrl-btn { width: 42px; height: 42px; } .play-btn { width: 54px; height: 54px; } }
    </style>
</head>
<body>

<div class="player-card">
    <h1><i class="fas fa-folder-open"></i> 文件夹播放器 · 自然数排序</h1>
    <div class="sub">📁 选择文件夹 → 自动按数字序号排序 → 连播 | 书签/备份/Gist</div>

    <div class="source-buttons">
        <label class="primary-btn" for="folderInput"><i class="fas fa-folder"></i> 选择文件夹</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
        <label class="secondary-outline" for="fileInput"><i class="fas fa-music"></i> 单个文件</label>
        <input type="file" id="fileInput" accept="audio/*" style="display:none;">
        <button id="clearPlaylistBtn" class="secondary-outline"><i class="fas fa-trash"></i> 清空列表</button>
    </div>

    <!-- 播放列表区域 -->
    <div class="playlist-section">
        <div class="playlist-header">
            <span><i class="fas fa-list"></i> 播放列表 <span id="playlistCount">0</span> 首</span>
            <span id="loopModeBtn" class="loop-mode"><i class="fas fa-redo-alt"></i> 列表循环</span>
        </div>
        <div id="playlistContainer" style="max-height: 190px; overflow-y: auto;">
            <div style="padding: 20px; text-align: center; color: #7f8c8d; font-size: 0.7rem;">选择文件夹后自动排序显示</div>
        </div>
    </div>

    <div class="track-info">
        <div class="track-title" id="trackTitle">🎵 未播放</div>
        <div id="trackDuration" style="font-size:0.65rem;">--:-- / --:--</div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <div class="player-controls">
        <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-fast"></i></button>
        <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-fast"></i></button>
    </div>
    <div class="progress-section">
        <div class="time-row"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
        <div class="progress-bar-bg" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="goto-section">
        <input type="text" id="gotoInput" class="goto-input" placeholder="跳转时间 1:30 或 90">
        <button id="gotoBtn" class="secondary-outline" style="padding:4px 12px;">跳转</button>
        <button id="rewind5Btn" class="secondary-outline"><i class="fas fa-backward-step"></i> -5s</button>
        <button id="forward5Btn" class="secondary-outline"><i class="fas fa-forward-step"></i> +5s</button>
    </div>

    <div class="timer-panel">
        <div class="timer-card"><div><i class="fas fa-hourglass-half"></i> 定时停止</div>
            <input type="number" id="sleepMin" value="30" style="width:70px; border-radius:20px; border:1px solid #ccc; padding:4px;"> 分钟
            <button id="setSleepBtn" class="tiny-btn">启动</button> <button id="cancelSleepBtn" class="tiny-btn">取消</button>
            <div id="sleepStatus" style="font-size:0.6rem;"></div>
        </div>
        <div class="timer-card"><div><i class="fas fa-cloud-upload-alt"></i> 自动备份Gist</div>
            <input type="number" id="backupInterval" value="10" style="width:70px;"> 分钟/次
            <button id="startAutoBackup" class="tiny-btn">启动</button> <button id="stopAutoBackup" class="tiny-btn">停止</button>
            <div id="backupStatus" style="font-size:0.6rem;"></div>
        </div>
    </div>

    <div class="action-bar">
        <button id="addBookmarkBtn" class="secondary-outline"><i class="fas fa-bookmark"></i> 添加书签</button>
        <button id="saveGistBtn" class="secondary-outline"><i class="fab fa-github"></i> 备份到Gist</button>
        <button id="loadGistBtn" class="secondary-outline"><i class="fas fa-sync-alt"></i> 从Gist恢复</button>
    </div>

    <div><div class="bookmark-list" id="bookmarkList"></div></div>

    <div class="gist-area">
        <input type="text" id="gistIdInput" placeholder="Gist ID (自动记忆)" style="width:100%; border-radius:40px; padding:6px 12px; margin-bottom:6px;">
        <input type="password" id="tokenInput" placeholder="GitHub Token (需gist权限)" style="width:70%; border-radius:40px; padding:6px 12px;">
        <button id="saveTokenBtn" class="tiny-btn">记住Token</button>
        <div id="gistStatus" style="font-size:0.65rem; margin-top:4px;"></div>
    </div>
</div>

<!-- 悬浮条 -->
<div id="floatBar" class="floating-player">
    <div class="float-info"><div id="floatTitle">未播放</div><div id="floatTime">0:00/0:00</div></div>
    <div class="float-buttons">
        <button class="float-ctrl" id="floatPrev"><i class="fas fa-backward-fast"></i></button>
        <button class="float-ctrl float-play" id="floatPlayPause"><i class="fas fa-play"></i></button>
        <button class="float-ctrl" id="floatNext"><i class="fas fa-forward-fast"></i></button>
        <button class="float-ctrl" id="floatHide" style="background:none;"><i class="fas fa-chevron-down"></i></button>
    </div>
</div>

<script>
    // -------------------- DOM 元素 --------------------
    const audio = document.getElementById('audioPlayer');
    const folderInput = document.getElementById('folderInput');
    const singleFileInput = document.getElementById('fileInput');
    const playlistContainer = document.getElementById('playlistContainer');
    const playlistCountSpan = document.getElementById('playlistCount');
    const trackTitle = document.getElementById('trackTitle');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBarBg = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const loopModeBtn = document.getElementById('loopModeBtn');
    const clearPlaylistBtn = document.getElementById('clearPlaylistBtn');
    const gotoInput = document.getElementById('gotoInput');
    const gotoBtn = document.getElementById('gotoBtn');
    const rewind5 = document.getElementById('rewind5Btn');
    const forward5 = document.getElementById('forward5Btn');
    const addBookmarkBtn = document.getElementById('addBookmarkBtn');
    const bookmarkListDiv = document.getElementById('bookmarkList');
    const saveGistBtn = document.getElementById('saveGistBtn');
    const loadGistBtn = document.getElementById('loadGistBtn');
    const gistIdInput = document.getElementById('gistIdInput');
    const tokenInput = document.getElementById('tokenInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');
    const gistStatus = document.getElementById('gistStatus');
    const sleepMin = document.getElementById('sleepMin');
    const setSleepBtn = document.getElementById('setSleepBtn');
    const cancelSleepBtn = document.getElementById('cancelSleepBtn');
    const sleepStatus = document.getElementById('sleepStatus');
    const backupIntervalInput = document.getElementById('backupInterval');
    const startAutoBackup = document.getElementById('startAutoBackup');
    const stopAutoBackup = document.getElementById('stopAutoBackup');
    const backupStatusDiv = document.getElementById('backupStatus');
    const floatTitle = document.getElementById('floatTitle');
    const floatTime = document.getElementById('floatTime');
    const floatPrev = document.getElementById('floatPrev');
    const floatPlayPause = document.getElementById('floatPlayPause');
    const floatNext = document.getElementById('floatNext');
    const floatHide = document.getElementById('floatHide');
    const floatBar = document.getElementById('floatBar');

    // -------------------- 全局状态 --------------------
    let playlist = [];          // { file, name }
    let currentIndex = -1;
    let currentBookmarks = [];  // { time, label }
    let loopMode = 'list';      // 'list', 'single'
    let sleepTimer = null;
    let autoBackupInterval = null;
    let pendingRewind = false;
    let skipRewind = false;
    let currentFileObj = null;

    // 存储Keys
    const TOKEN_KEY = 'audio_gh_token';
    const GIST_ID_KEY = 'audio_gist_id';

    // -------------------- 核心：智能自然排序（忽略文字，按数字序列比较）--------------------
    function naturalCompare(a, b) {
        // 提取文件名中所有的数字段
        const getNumberGroups = (str) => {
            const matches = str.match(/\d+/g);
            return matches ? matches.map(Number) : [];
        };
        const numsA = getNumberGroups(a.name);
        const numsB = getNumberGroups(b.name);
        const maxLen = Math.max(numsA.length, numsB.length);
        for (let i = 0; i < maxLen; i++) {
            const valA = i < numsA.length ? numsA[i] : 0;
            const valB = i < numsB.length ? numsB[i] : 0;
            if (valA !== valB) return valA - valB;
        }
        // 如果数字完全相同，按原始字符串排序
        return a.name.localeCompare(b.name);
    }

    // 选择文件夹处理
    folderInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        const audioFiles = files.filter(f => /\.(mp3|m4a|opus|ogg|wav)$/i.test(f.name));
        if (audioFiles.length === 0) { alert("文件夹中没有支持的音频文件"); return; }
        // 使用自然排序
        playlist = audioFiles.sort(naturalCompare);
        renderPlaylist();
        if (playlist.length) {
            currentIndex = 0;
            loadTrack(currentIndex);
        }
    });

    // 单个文件
    singleFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            playlist = [ e.target.files[0] ];
            renderPlaylist();
            currentIndex = 0;
            loadTrack(0);
        }
    });

    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        if (playlist.length === 0) {
            playlistContainer.innerHTML = '<div style="padding:20px;text-align:center;color:#7f8c8d;">暂无音频，选择文件夹</div>';
            playlistCountSpan.innerText = '0';
            return;
        }
        playlistCountSpan.innerText = playlist.length;
        playlist.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
            // 显示序号 (从1开始)
            const displayNum = (idx+1).toString().padStart(2,'0');
            div.innerHTML = `<span class="track-num">${displayNum}</span>
                             <span class="track-name" title="${escapeHtml(item.name)}">${escapeHtml(truncateName(item.name))}</span>`;
            div.addEventListener('click', () => {
                if (currentIndex !== idx) {
                    currentIndex = idx;
                    loadTrack(currentIndex);
                }
            });
            playlistContainer.appendChild(div);
        });
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function truncateName(name) { if(name.length>40) return name.slice(0,37)+'...'; return name; }

    function updatePlaylistActive() {
        const items = document.querySelectorAll('.playlist-item');
        items.forEach((item, i) => {
            if (i === currentIndex) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    // 加载指定索引的音频
    async function loadTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        const file = playlist[index];
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.load();
        currentFileObj = file;
        trackTitle.innerText = file.name;
        floatTitle.innerText = file.name;
        if (window._oldUrl) URL.revokeObjectURL(window._oldUrl);
        window._oldUrl = url;
        
        // 加载该书签和进度
        const stored = localStorage.getItem(`bm_${file.name}`);
        if (stored) {
            try { currentBookmarks = JSON.parse(stored); renderBookmarks(); } catch(e) { currentBookmarks = []; renderBookmarks(); }
        } else { currentBookmarks = []; renderBookmarks(); }
        
        const progKey = `prog_${file.name}`;
        const prog = localStorage.getItem(progKey);
        if (prog) {
            try { let p = JSON.parse(prog); if (p.time && !isNaN(p.time)) audio.currentTime = Math.min(p.time, audio.duration||1e9); } catch(e) {}
        }
        updatePlaylistActive();
        // 自动播放
        audio.play().catch(e=>console.log);
        saveCurrentFileToIndexedDB(file);
    }

    // 下一首/上一首逻辑
    function nextTrack() {
        if (loopMode === 'single') {
            audio.currentTime = 0;
            audio.play();
            return;
        }
        let next = currentIndex + 1;
        if (next >= playlist.length) {
            if (loopMode === 'list') next = 0;
            else return;
        }
        if (next < playlist.length) {
            currentIndex = next;
            loadTrack(currentIndex);
        }
    }
    function prevTrack() {
        let prev = currentIndex - 1;
        if (prev < 0) {
            if (loopMode === 'list') prev = playlist.length - 1;
            else return;
        }
        if (prev >= 0) {
            currentIndex = prev;
            loadTrack(currentIndex);
        }
    }

    audio.addEventListener('ended', () => { pendingRewind = false; nextTrack(); });

    // 后退5秒逻辑（停顿重播）
    function markStopped() { if (!skipRewind) pendingRewind = true; skipRewind = false; }
    function applyRewind() { if (pendingRewind && audio.duration) { audio.currentTime = Math.max(0, audio.currentTime-5); pendingRewind = false; saveProgress(); } }
    audio.addEventListener('pause', () => { if (!audio.ended) markStopped(); });
    audio.addEventListener('play', () => { applyRewind(); });
    function saveProgress() { if (currentFileObj) localStorage.setItem(`prog_${currentFileObj.name}`, JSON.stringify({ time: audio.currentTime })); }
    setInterval(() => { if (currentFileObj) saveProgress(); }, 5000);

    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
    playPauseBtn.addEventListener('click', togglePlay);
    floatPlayPause.addEventListener('click', togglePlay);
    audio.addEventListener('play', () => { playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>'; floatPlayPause.innerHTML = '<i class="fas fa-pause"></i>'; });
    audio.addEventListener('pause', () => { playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'; floatPlayPause.innerHTML = '<i class="fas fa-play"></i>'; });
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    floatPrev.addEventListener('click', prevTrack);
    floatNext.addEventListener('click', nextTrack);
    rewind5.addEventListener('click', () => { skipRewind = true; audio.currentTime = Math.max(0, audio.currentTime-5); });
    forward5.addEventListener('click', () => { skipRewind = true; audio.currentTime = Math.min(audio.duration, audio.currentTime+5); });

    // 进度条
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime/audio.duration)*100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            totalTimeSpan.innerText = formatTime(audio.duration);
            floatTime.innerText = `${formatTime(audio.currentTime)}/${formatTime(audio.duration)}`;
        }
    });
    progressBarBg.addEventListener('click', (e) => {
        const rect = progressBarBg.getBoundingClientRect();
        let percent = (e.clientX - rect.left)/rect.width;
        audio.currentTime = percent * audio.duration;
        skipRewind = true;
    });
    gotoBtn.addEventListener('click', () => {
        let sec = parseFloat(gotoInput.value);
        if (isNaN(sec)) {
            let parts = gotoInput.value.split(':');
            if (parts.length===2) sec = parseInt(parts[0])*60 + parseInt(parts[1]);
            else if (parts.length===3) sec = parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseInt(parts[2]);
            else sec = NaN;
        }
        if (!isNaN(sec) && audio.duration) audio.currentTime = Math.min(Math.max(0,sec), audio.duration);
        gotoInput.value = '';
    });

    // 循环模式切换
    loopModeBtn.addEventListener('click', () => {
        if (loopMode === 'list') { loopMode = 'single'; loopModeBtn.innerHTML = '<i class="fas fa-repeat-1"></i> 单曲循环'; }
        else { loopMode = 'list'; loopModeBtn.innerHTML = '<i class="fas fa-redo-alt"></i> 列表循环'; }
    });

    // 书签功能
    function formatTime(sec) {
        if (isNaN(sec)) return '0:00';
        const h = Math.floor(sec/3600);
        const m = Math.floor((sec%3600)/60);
        const s = Math.floor(sec%60);
        if (h>0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        return `${m}:${s.toString().padStart(2,'0')}`;
    }
    function addBookmark() {
        if (!audio.src || !audio.duration) return alert("请先播放音频");
        let time = audio.currentTime;
        let label = formatTime(time);
        if (currentBookmarks.some(b => Math.abs(b.time-time)<0.5)) return alert("已有该书签");
        currentBookmarks.push({ time, label });
        currentBookmarks.sort((a,b)=>a.time-b.time);
        renderBookmarks();
        if (currentFileObj) localStorage.setItem(`bm_${currentFileObj.name}`, JSON.stringify(currentBookmarks));
    }
    function renderBookmarks() {
        bookmarkListDiv.innerHTML = '';
        if (currentBookmarks.length===0) { bookmarkListDiv.innerHTML = '<span style="font-size:0.6rem;">暂无书签</span>'; return; }
        currentBookmarks.forEach((bm, idx) => {
            let chip = document.createElement('div');
            chip.className = 'bookmark-chip';
            chip.innerHTML = `<span style="cursor:pointer;">${bm.label}</span> <button class="bookmark-delete" data-idx="${idx}" style="background:none; border:none; color:#aaa; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>`;
            chip.querySelector('span').addEventListener('click', () => { audio.currentTime = bm.time; });
            chip.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); currentBookmarks.splice(idx,1); renderBookmarks(); if(currentFileObj) localStorage.setItem(`bm_${currentFileObj.name}`, JSON.stringify(currentBookmarks)); });
            bookmarkListDiv.appendChild(chip);
        });
    }
    addBookmarkBtn.addEventListener('click', addBookmark);

    // Gist 同步
    function extractGistId(str) { let m = str.match(/([a-fA-F0-9]{32})/); return m ? m[1] : null; }
    async function backupToGist(silent=false) {
        let token = localStorage.getItem(TOKEN_KEY);
        if (!token) { alert("请先输入Token并记住"); return; }
        if (!currentFileObj) { alert("无正在播放的音频"); return; }
        let gistId = extractGistId(gistIdInput.value);
        let data = { audioFileName: currentFileObj.name, currentTime: audio.currentTime, bookmarks: currentBookmarks, playlistNames: playlist.map(f=>f.name), loopMode, lastUpdated: new Date() };
        let content = JSON.stringify(data);
        try {
            let url = 'https://api.github.com/gists', method='POST', body={ description: 'Audio progress', public: false, files: { 'audio_state.json': { content } } };
            if (gistId) { url = `https://api.github.com/gists/${gistId}`; method='PATCH'; body={ files: { 'audio_state.json': { content } } }; }
            let res = await fetch(url, { method, headers: { 'Authorization': `token ${token}`, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
            if (!res.ok) throw new Error(await res.text());
            let result = await res.json();
            gistIdInput.value = result.id;
            localStorage.setItem(GIST_ID_KEY, result.id);
            if (!silent) gistStatus.innerHTML = `✅ 备份成功 ID: ${result.id}`;
            else backupStatusDiv.innerHTML = `🔄 自动备份 ${new Date().toLocaleTimeString()}`;
        } catch(e) { if (!silent) alert("备份失败 "+e.message); }
    }
    async function restoreFromGist() {
        let token = localStorage.getItem(TOKEN_KEY);
        if (!token) { alert("请先保存Token"); return; }
        let gistId = extractGistId(gistIdInput.value);
        if (!gistId) { alert("请输入有效Gist ID"); return; }
        try {
            let res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error();
            let gist = await res.json();
            let content = gist.files['audio_state.json']?.content;
            if (!content) throw new Error();
            let data = JSON.parse(content);
            if (data.audioFileName && data.currentTime && currentFileObj && currentFileObj.name === data.audioFileName) {
                audio.currentTime = Math.min(data.currentTime, audio.duration);
                currentBookmarks = data.bookmarks || [];
                renderBookmarks();
                saveProgress();
                gistStatus.innerHTML = "✅ 恢复成功";
            } else if (currentFileObj) alert("当前音频与备份不匹配，请先打开对应文件");
            else alert("无播放中的音频，请先选择文件夹");
        } catch(e) { alert("恢复失败 "+e.message); }
    }
    saveGistBtn.addEventListener('click', ()=>backupToGist(false));
    loadGistBtn.addEventListener('click', restoreFromGist);
    saveTokenBtn.addEventListener('click', () => { let t = tokenInput.value.trim(); if(t) { localStorage.setItem(TOKEN_KEY, t); gistStatus.innerHTML="Token已保存"; } });
    let savedGist = localStorage.getItem(GIST_ID_KEY);
    if (savedGist) gistIdInput.value = savedGist;

    // 定时停止
    function stopSleep() { if(sleepTimer) clearTimeout(sleepTimer); sleepTimer=null; sleepStatus.innerText=''; }
    function startSleep(min) { stopSleep(); sleepTimer = setTimeout(()=>{ if(!audio.paused) audio.pause(); sleepStatus.innerText='定时停止已触发'; }, min*60000); sleepStatus.innerText=`将在${min}分钟后停止`; }
    setSleepBtn.addEventListener('click',()=>{ let v=parseInt(sleepMin.value); if(v>0) startSleep(v); });
    cancelSleepBtn.addEventListener('click', stopSleep);
    // 自动备份
    function stopAutoBackupFunc() { if(autoBackupInterval) clearInterval(autoBackupInterval); autoBackupInterval=null; backupStatusDiv.innerText='自动备份已停止'; }
    function startAutoBackupFunc() { stopAutoBackupFunc(); let mins = parseInt(backupIntervalInput.value); if(mins<2) mins=5; autoBackupInterval = setInterval(()=>{ if(currentFileObj) backupToGist(true); }, mins*60000); backupStatusDiv.innerText=`每${mins}分钟自动备份`; }
    startAutoBackup.addEventListener('click', startAutoBackupFunc);
    stopAutoBackup.addEventListener('click', stopAutoBackupFunc);

    // 悬浮条隐藏/显示
    floatHide.addEventListener('click', ()=> floatBar.style.display='none');
    let showSpan = document.createElement('span'); showSpan.innerText=' 显示悬浮条'; showSpan.style.cursor='pointer'; showSpan.style.textDecoration='underline'; showSpan.onclick=()=>floatBar.style.display='flex';
    gistStatus.appendChild(showSpan);

    function saveCurrentFileToIndexedDB(file) {
        // 简化：仅记录最后文件名，不做全量存储
        localStorage.setItem('lastAudioName', file.name);
    }
    clearPlaylistBtn.addEventListener('click', () => { playlist = []; renderPlaylist(); audio.pause(); audio.src=''; currentIndex=-1; trackTitle.innerText='未播放'; currentFileObj=null; });
    window.addEventListener('load', () => {});
</script>
</body>
</html>
