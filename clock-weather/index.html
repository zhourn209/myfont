<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终极锁屏天气时钟</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width: 2400px; /* 设置固定宽度以适合横屏 */
  height: 1080px; /* 设置固定高度以适应横屏 */
  font-family:'Nunito',sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:40px 20px;
  color:#fff;
}
.day{background:linear-gradient(180deg,#4facfe,#00f2fe)}
.night{background:linear-gradient(180deg,#0f2027,#000)}
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(25px);
  border-radius:25px;
  padding:15px 20px;
}

.top{
  display:flex;
  justify-content:space-between; 
  align-items:center;
  width: 100%; 
}

.date-group{
  display:flex;
  flex-direction:column;
}

.date{font-size:36px;font-weight:700} /* 放大日期 */
.week{font-size:24px;opacity:0.8} /* 放大星期 */
.lunar{font-size:24px;opacity:0.8} /* 放大农历字体 */

.city{font-size:18px;opacity:0.7;margin-top:5px} /* 增大城市字体 */

.time{
  font-size:240px; /* 放大时间显示 */
  font-weight:700;
  text-align:center;
}

.bottom{display:flex;justify-content:space-between;align-items:center}
.weather{display:flex;gap:20px;align-items:center}
.right{display:flex;gap:30px}
.item{text-align:center;font-size:18px} /* 增大底部信息字体 */
.temp-main{font-size:48px;font-weight:700} /* 放大温度字体 */
.temp-sub{font-size:24px;opacity:0.7} /* 放大温度范围字体 */
</style>
</head>
<body>

<div class="top glass">
  <div class="date-group">
    <div class="week" id="week"></div>
    <div class="date" id="date"></div>
    <div class="city" id="city">上海</div> 
  </div>
  <div class="lunar" id="lunar">农历：正在加载...</div> 
</div>

<div class="time" id="time">00:00</div>

<div class="bottom glass">
  <div class="weather">
    <div id="icon">☁️</div>
    <div>
      <div id="desc">加载中</div>
    </div>
  </div>

  <div>
    <div class="temp-main" id="temp">--°</div>
    <div class="temp-sub" id="range">-- / --</div>
  </div>

  <div class="right">
    <div class="item">湿度<br><span id="hum">--</span>%</div>
    <div class="item">风速<br><span id="wind">--</span></div>
    <div class="item">AQI<br><span id="aqi">--</span></div>
  </div>
</div>

<script>
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('time').innerText=`${h}:${m}`;

  const days=['日','一','二','三','四','五','六'];
  document.getElementById('week').innerText='星期'+days[now.getDay()];
  document.getElementById('date').innerText=
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

  document.body.className=(now.getHours()>=6&&now.getHours()<18)?'day':'night';
}
setInterval(updateTime,1000);
updateTime();

// 农历获取示例（可以使用第三方库来替代此代码）
function loadLunar() {
  const lunarDate = "农历：示例日期"; // 这里可以用API或者农历库替换
  document.getElementById('lunar').innerText = lunarDate;
}

// 固定城市为上海的天气信息
async function loadWeather(cityName='Shanghai'){
  try{
    const url = `https://wttr.in/${cityName}?format=j1`;
    const res=await fetch(url);
    const data=await res.json();

    const c=data.current_condition[0];
    const today=data.weather[0];

    document.getElementById('city').innerText = cityName;
    document.getElementById('desc').innerText=c.weatherDesc[0].value;
    document.getElementById('temp').innerText=c.temp_C+'°C';
    document.getElementById('range').innerText=
      today.mintempC+'° / '+today.maxtempC+'°';

    document.getElementById('hum').innerText=c.humidity;
    document.getElementById('wind').innerText=c.windspeedKmph;

    let icon='☁️';
    const code=c.weatherCode;
    if(code==113) icon='☀️';
    else if(code==116) icon='⛅';
    else if(code>=176) icon='🌧️';
    document.getElementById('icon').innerText=icon;

  }catch(e){
    document.getElementById('desc').innerText='天气加载失败';
  }
}

loadWeather(); // 加载上海天气
loadLunar(); // 加载农历信息

</script>

</body>
</html>
