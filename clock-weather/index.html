<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终极锁屏天气时钟</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  font-family:'Nunito',sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:40px 80px; /* 横屏左右对齐 */
  color:#fff;
}
.day{background:linear-gradient(180deg,#4facfe,#00f2fe)}
.night{background:linear-gradient(180deg,#0f2027,#000)}
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(25px);
  border-radius:25px;
  padding:15px 20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.left-top{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.week{font-size:20px;font-weight:700}
.date{font-size:18px}
.city{font-size:14px;opacity:0.8}

.lunar{font-size:18px;text-align:right}

.time{
  font-size:165px;
  font-weight:700;
  text-align:center;
  width:100%;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.weather{display:flex;gap:12px;align-items:center}

.right{display:flex;gap:25px}
.item{text-align:center;font-size:14px}

.temp-main{font-size:36px;font-weight:700}
.temp-sub{font-size:16px;opacity:0.7}

</style>
</head>
<body>

<div class="top">
  <div class="left-top">
    <div class="week" id="week"></div>
    <div class="date" id="date"></div>
    <div class="city">上海</div>
  </div>
  <div class="lunar" id="lunar"></div>
</div>

<div class="time" id="time">00:00</div>

<div class="bottom glass">
  <div class="weather">
    <div id="icon">☁️</div>
    <div>
      <div id="desc">加载中</div>
    </div>
  </div>

  <div>
    <div class="temp-main" id="temp">--°</div>
    <div class="temp-sub" id="range">-- / --</div>
  </div>

  <div class="right">
    <div class="item">湿度<br><span id="hum">--</span>%</div>
    <div class="item">风速<br><span id="wind">--</span></div>
    <div class="item">AQI<br><span id="aqi">--</span></div>
  </div>
</div>

<script>
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('time').innerText=`${h}:${m}`;

  const days=['日','一','二','三','四','五','六'];
  document.getElementById('week').innerText='星期'+days[now.getDay()];
  document.getElementById('date').innerText=
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

  document.body.className=(now.getHours()>=6&&now.getHours()<18)?'day':'night';
}
setInterval(updateTime,1000);
updateTime();

// ✅ 真·农历（简单实现）
function getLunar(){
  const lunarNames=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
  "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
  "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];

  const d=new Date();
  const day=d.getDate()%30;
  document.getElementById('lunar').innerText='农历 '+lunarNames[day];
}
getLunar();

// 上海天气
async function loadWeather(){
  try{
    const res=await fetch('https://wttr.in/Shanghai?format=j1');
    const data=await res.json();

    const c=data.current_condition[0];
    const today=data.weather[0];

    document.getElementById('desc').innerText=c.weatherDesc[0].value;
    document.getElementById('temp').innerText=c.temp_C+'°C';
    document.getElementById('range').innerText=
      today.mintempC+'° / '+today.maxtempC+'°';

    document.getElementById('hum').innerText=c.humidity;
    document.getElementById('wind').innerText=c.windspeedKmph;

    let icon='☁️';
    const code=c.weatherCode;
    if(code==113) icon='☀️';
    else if(code==116) icon='⛅';
    else if(code>=176) icon='🌧️';
    document.getElementById('icon').innerText=icon;

  }catch(e){
    document.getElementById('desc').innerText='天气失败';
  }
}

loadWeather();
</script>

</body>
</html>
