<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终极锁屏天气时钟</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  font-family:'Nunito',sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:40px 20px;
  color:#fff;
  transition:1s;
}
.day{background:linear-gradient(180deg,#4facfe,#00f2fe)}
.night{background:linear-gradient(180deg,#0f2027,#000)}
.glass{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(25px);
  border-radius:25px;
  padding:15px 20px;
}
.top{text-align:center}
.date{font-size:18px;font-weight:700}
.city{font-size:14px;opacity:0.8}
.time{font-size:110px;font-weight:700;text-align:center}
.bottom{display:flex;justify-content:space-between;align-items:center}
.weather{display:flex;gap:10px;align-items:center}
.right{display:flex;gap:15px}
.item{text-align:center;font-size:12px}
.temp-main{font-size:30px;font-weight:700}
.temp-sub{font-size:14px;opacity:0.7}
</style>
</head>
<body>

<div class="top glass">
  <div class="date" id="date"></div>
  <div class="city" id="city">定位中...</div>
</div>

<div class="time" id="time">00:00</div>

<div class="bottom glass">
  <div class="weather">
    <div id="icon">☁️</div>
    <div>
      <div id="desc">加载中</div>
      <div style="font-size:12px;opacity:0.6" id="lunar">--</div>
    </div>
  </div>

  <div>
    <div class="temp-main" id="temp">--°</div>
    <div class="temp-sub" id="range">-- / --</div>
  </div>

  <div class="right">
    <div class="item">湿度<br><span id="hum">--</span>%</div>
    <div class="item">风速<br><span id="wind">--</span>km/h</div>
    <div class="item">AQI<br><span id="aqi">--</span></div>
  </div>
</div>

<script>
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('time').innerText=`${h}:${m}`;

  const days=['日','一','二','三','四','五','六'];
  document.getElementById('date').innerText=
    `${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;

  document.body.className=(now.getHours()>=6&&now.getHours()<18)?'day':'night';
}
setInterval(updateTime,1000);
updateTime();

// 简易农历（示例版）
function lunar(){
  const d=new Date();
  document.getElementById('lunar').innerText='农历 '+d.getDate();
}
lunar();

// 定位
navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;

  const res=await fetch(`https://wttr.in/${lat},${lon}?format=j1`);
  const data=await res.json();

  const c=data.current_condition[0];
  const today=data.weather[0];

  document.getElementById('city').innerText=data.nearest_area[0].areaName[0].value;
  document.getElementById('desc').innerText=c.weatherDesc[0].value;
  document.getElementById('temp').innerText=c.temp_C+'°C';
  document.getElementById('range').innerText=
    today.mintempC+'° / '+today.maxtempC+'°';

  document.getElementById('hum').innerText=c.humidity;
  document.getElementById('wind').innerText=c.windspeedKmph;
  document.getElementById('aqi').innerText='--';

  let icon='☁️';
  const code=c.weatherCode;
  if(code==113) icon='☀️';
  else if(code==116) icon='⛅';
  else if(code>=176) icon='🌧️';
  document.getElementById('icon').innerText=icon;
});
</script>

</body>
</html>
