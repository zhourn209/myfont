<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:
    "Trebuchet MS",
    "Microsoft YaHei",
    "PingFang SC",
    "Segoe UI",
    sans-serif;
    background:#0f172a;
    color:#fff;
    padding:12px;
}

#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    display:none;
}
.success{background:#22c55e;}
.error{background:#ef4444;}

.card{
    background:#1e293b;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}

input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}

button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
    font-weight:700;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.count{
    font-size:15px;
    font-weight:700;
    color:#cbd5f5;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
}

.ref{
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    color:#facc15;
    line-height:1.6;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
}

td,th{
    padding:10px;
    text-align:center;
}

/* 标签页 */
#tabs button{
    cursor:pointer;
}

/* 手机适配 */
@media (max-width:600px){
    table thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{
        background:#334155;
        margin-bottom:12px;
        border-radius:14px;
        padding:12px;
    }
    td{text-align:left;}
    td::before{
        content:attr(data-label);
        font-size:12px;
        color:#94a3b8;
        display:block;
    }
}
</style>
</head>

<body>

<div id="status"></div>

<div class="card">
<div class="topbar">
<div>
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">

<button onclick="saveConfig()">保存</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>
</div>

<div class="count">
记录总数：<span id="recordCount">0</span>
</div>
</div>
</div>

<div class="card toolbar">
<button onclick="addRow()">添加</button>
<button onclick="exportCSV()">CSV</button>
<button onclick="exportJSON()">JSON</button>
<button onclick="importFile()">导入</button>

<div class="ref">
正常&lt;120/&lt;80 ｜ 正常高值120-139/80-89 ｜ 1级140-159/90-99 ｜ 2级≥160/≥100<br>
56岁男性建议：收缩压110-135 / 舒张压70-85 ｜ 心率60-100次/分<br>
双臂差&lt;10mmHg正常 ｜ 10-15轻度差异 ｜ ≥15需关注
</div>
</div>

<!-- ✅ 标签页 -->
<div id="tabs"></div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th>
<th>血压</th>
<th>心率</th>
<th>备注</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data = {};
let currentDate = getDateKey();
let timer=null;

/* 日期key */
function getDateKey(){
    return new Date().toISOString().split("T")[0];
}

/* 提示 */
function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

/* 自动上传 */
function autoSync(){
    clearTimeout(timer);
    timer=setTimeout(()=>{ sync(); },60000);
}

/* 配置 */
function saveConfig(){
    localStorage.token=token.value;
    localStorage.gist=gist.value;
    show("已保存");
}

function loadConfig(){
    token.value=localStorage.token||"";
    gist.value=localStorage.gist||"";
}

/* 添加 */
function addRow(){
    const key = getDateKey();

    if(!data[key]) data[key]=[];

    currentDate = key;

    data[key].push({
        time:new Date().toLocaleString(),
        bp:"",
        hr:"",
        note:""
    });

    renderTabs();
    render();
    autoSync();
}

/* 标签页 */
function renderTabs(){
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

    const keys = Object.keys(data).sort().reverse();

    keys.forEach((k,i)=>{
        const btn = document.createElement("button");

        btn.innerText = k;

        if(k === currentDate){
            btn.style.background="#38bdf8";
        }else{
            btn.style.background = i%2 ? "#22c55e" : "#16a34a";
        }

        btn.onclick = ()=>{
            currentDate = k;
            renderTabs();
            render();
        };

        tabs.appendChild(btn);
    });
}

/* 渲染 */
function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";

    const list = data[currentDate] || [];

    list.forEach((r,i)=>{
        const tr=document.createElement("tr");

        tr.innerHTML=`
<td contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td contenteditable onblur="edit(${i},'bp',this.innerText)">${r.bp}</td>
<td contenteditable onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td><button onclick="del(${i})">删除</button></td>
`;

        tbody.appendChild(tr);
    });

    document.getElementById("recordCount").innerText = list.length;
}

/* 编辑 */
function edit(i,k,v){
    data[currentDate][i][k] = v.trim();
    autoSync();
}

/* 删除 */
function del(i){
    data[currentDate].splice(i,1);
    render();
    autoSync();
}

/* 上传 */
async function sync(){
    try{
        await fetch(`https://api.github.com/gists/${gist.value}`,{
            method:"PATCH",
            headers:{Authorization:"token "+token.value},
            body:JSON.stringify({
                files:{
                    "data.json":{
                        content:JSON.stringify(data,null,2)
                    }
                }
            })
        });
        show("自动已同步");
    }catch{
        show("上传失败","error");
    }
}

/* 下载 + 兼容旧数据 */
async function loadFromGist(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`);
        if(!res.ok) return;

        const j=await res.json();
        const content=j.files["data.json"]?.content;
        if(!content) return;

        const parsed=JSON.parse(content);

        if(Array.isArray(parsed)){
            data = {};
            parsed.forEach(r=>{
                const key = r.time ? r.time.split(" ")[0] : getDateKey();
                if(!data[key]) data[key]=[];
                data[key].push(r);
            });
        }else{
            data = parsed;
        }

        currentDate = Object.keys(data).sort().reverse()[0] || getDateKey();

        renderTabs();
        render();
    }catch{}
}

/* 导出 */
function exportCSV(){
    let csv="time,bp,hr,note\n";

    Object.values(data).flat().forEach(r=>{
        csv+=`${r.time},${r.bp},${r.hr},${r.note}\n`;
    });

    download(csv,"data.csv");
}

function exportJSON(){
    download(JSON.stringify(data,null,2),"data.json");
}

function download(c,n){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([c]));
    a.download=n;
    a.click();
}

/* 导入 */
function importFile(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();

        reader.onload=()=>{
            const parsed = JSON.parse(reader.result);
            data = parsed;
            renderTabs();
            render();
            autoSync();
        };

        reader.readAsText(file);
    };

    input.click();
}

/* 初始化 */
loadConfig();
loadFromGist();
renderTabs();
render();

</script>

</body>
</html>
