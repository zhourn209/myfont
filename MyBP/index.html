<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI";
    background:#020617;
    color:#fff;
    padding:12px;
}
.card{
    background:#111827;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}
input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}
button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
    font-weight:700;
}
#status{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    display:none;
}
.success{background:#22c55e;}
.error{background:#ef4444;}
</style>
</head>

<body>

<div id="status"></div>

<div class="card">
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">

<button onclick="saveConfig()">保存</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>
</div>

<script>

function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

/* 正确读取 */
function getToken(){
    return document.getElementById("token").value.trim();
}
function getGist(){
    return document.getElementById("gist").value.trim();
}

/* 保存配置 */
function saveConfig(){
    localStorage.setItem("token", getToken());
    localStorage.setItem("gist", getGist());
    show("已保存");
}

/* 加载配置（关键修复） */
function loadConfig(){
    document.getElementById("token").value = localStorage.getItem("token") || "";
    document.getElementById("gist").value = localStorage.getItem("gist") || "";
}

/* 测试连接 */
async function testConnection(){
    show("正在测试连接…");
    try{
        const res = await fetch(`https://api.github.com/gists/${getGist()}`,{
            headers:{Authorization:"token "+getToken()}
        });
        if(res.ok) show("连接成功");
        else show("连接失败","error");
    }catch(e){
        console.error(e);
        show("连接失败","error");
    }
}

/* 下载 */
async function loadFromGist(){
    show("正在下载…");
    try{
        const res = await fetch(`https://api.github.com/gists/${getGist()}`,{
            headers:{Authorization:"token "+getToken()}
        });
        if(res.ok) show("下载成功");
        else show("下载失败","error");
    }catch{
        show("下载失败","error");
    }
}

/* 上传 */
async function sync(){
    show("正在上传…");
    try{
        await fetch(`https://api.github.com/gists/${getGist()}`,{
            method:"PATCH",
            headers:{Authorization:"token "+getToken()},
            body:JSON.stringify({
                files:{
                    "data.json":{
                        content:"{}"
                    }
                }
            })
        });
        show("上传成功");
    }catch{
        show("上传失败","error");
    }
}

/* 初始化（关键） */
loadConfig();

</script>

</body>
</html>
