<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>健康记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:"Segoe UI";
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    padding:20px;
}

/* 状态提示 */
#status{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 20px;
    border-radius:8px;
    color:white;
    display:none;
}

.success{background:#4CAF50;}
.error{background:#f44336;}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

button{
    padding:8px 12px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

input{padding:6px;margin:5px;}

table{width:100%;border-collapse:collapse;}
td,th{padding:10px;text-align:center;}
tr:nth-child(even){background:#f9fafb;}

.abnormal{color:red;font-weight:bold;}
</style>
</head>

<body>

<div id="status"></div>

<div class="card">
<h3>🔐 GitHub 同步</h3>
Token: <input id="token"><br>
Gist ID: <input id="gist"><br>

<button onclick="saveConfig()">保存配置</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">⬇️ 下载</button>
<button onclick="sync()">⬆️ 上传</button>
</div>

<div class="card">
<button onclick="addRow()">➕ 添加</button>
<button onclick="exportCSV()">导出CSV</button>
<button onclick="exportJSON()">导出JSON</button>
<button onclick="importFile()">导入</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th><th>血压</th><th>心率</th><th>备注</th><th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="card">
正常:<span id="ok">0</span> | 异常:<span id="bad">0</span>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>
let data=[];

/* 状态提示 */
function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

/* 配置 */
function saveConfig(){
    localStorage.token=token.value;
    localStorage.gist=gist.value;
    show("已保存配置");
}

function loadConfig(){
    token.value=localStorage.token||"";
    gist.value=localStorage.gist||"";
}

/* 测试连接 */
async function testConnection(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`,{
            headers:{Authorization:"token "+token.value}
        });

        if(res.status===200){
            show("✅ 连接成功");
        }else{
            show("❌ 连接失败","error");
        }
    }catch(e){
        show("❌ 网络错误","error");
    }
}

/* 添加 */
function addRow(){
    data.push({
        time:new Date().toLocaleString(),
        bp:"120/80",
        hr:"70",
        note:""
    });
    render();
}

/* 渲染 */
function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";

    let ok=0,bad=0;

    data.forEach((r,i)=>{
        const [s,d]=r.bp.split("/").map(Number);
        const isBad=s>130||d>90;

        if(isBad) bad++; else ok++;

        const tr=document.createElement("tr");
        tr.innerHTML=`
<td contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td contenteditable class="${isBad?'abnormal':''}" onblur="edit(${i},'bp',this.innerText)">${r.bp}</td>
<td contenteditable onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td><button onclick="del(${i})">❌</button></td>
`;
        tbody.appendChild(tr);
    });

    ok.innerText=ok;
    bad.innerText=bad;

    drawChart();
}

/* 编辑 */
function edit(i,k,v){
    data[i][k]=v.trim();
    sync();
}

/* 删除 */
function del(i){
    data.splice(i,1);
    render();
    sync();
}

/* 上传 */
async function sync(){
    try{
        await fetch(`https://api.github.com/gists/${gist.value}`,{
            method:"PATCH",
            headers:{Authorization:"token "+token.value},
            body:JSON.stringify({
                files:{
                    "data.json":{
                        content:JSON.stringify(data)
                    }
                }
            })
        });
        show("⬆️ 更新完成");
    }catch(e){
        show("❌ 上传失败","error");
    }
}

/* 下载 */
async function loadFromGist(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`);
        const j=await res.json();
        data=JSON.parse(j.files["data.json"].content);
        render();
        show("⬇️ 更新完成");
    }catch(e){
        show("❌ 下载失败","error");
    }
}

/* 导出 */
function exportCSV(){
    let csv="time,bp,hr,note\n";
    data.forEach(r=>csv+=`${r.time},${r.bp},${r.hr},${r.note}\n`);
    download(csv,"data.csv");
    show("已导出CSV");
}

function exportJSON(){
    download(JSON.stringify(data,null,2),"data.json");
    show("已导出JSON");
}

function download(c,n){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([c]));
    a.download=n;
    a.click();
}

/* 导入 */
function importFile(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();

        reader.onload=()=>{
            if(file.name.endsWith(".json")){
                data=JSON.parse(reader.result);
            }else{
                const lines=reader.result.split("\n").slice(1);
                data=lines.map(l=>{
                    const [t,bp,hr,n]=l.split(",");
                    return {time:t,bp,hr,note:n};
                });
            }
            render();
            show("导入完成");
        };

        reader.readAsText(file);
    };
    input.click();
}

/* 图表 */
let chart;
function drawChart(){
    const labels=data.map(d=>d.time);
    const sys=data.map(d=>parseInt(d.bp));

    if(chart) chart.destroy();

    chart=new Chart(chartCanvas,{
        type:"line",
        data:{labels,datasets:[{label:"血压趋势",data:sys}]}
    });
}

loadConfig();
render();
</script>

</body>
</html>
