<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:"Microsoft YaHei";
    background:#0f172a;
    color:#fff;
    padding:12px;
}

.card{
    background:#1e293b;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}

button{
    padding:6px 12px;
    margin:4px;
    border:none;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
}

.count{
    font-size:15px;
    font-weight:700;
    color:#cbd5f5;
}

#tabs{
    display:flex;
    flex-wrap:wrap;
    margin-bottom:10px;
}

#tabs button{
    display:flex;
    align-items:center;
    gap:6px;
}

.delTab{
    background:#ef4444;
    color:#fff;
    border-radius:50%;
    padding:0 6px;
    font-size:12px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:8px;
    text-align:center;
}
</style>
</head>

<body>

<div class="card count">
总记录：<span id="totalCount">0</span> ｜ 当天：<span id="dayCount">0</span>
</div>

<div class="card">
<button onclick="addRow()">添加</button>
<button onclick="exportJSON()">导出JSON</button>
<button onclick="importFile()">导入</button>
</div>

<div id="tabs"></div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th>
<th>血压</th>
<th>心率</th>
<th>备注</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data={};
let currentDate=getDateKey();

/* ===== 日期统一 ===== */
function formatDate(str){
    if(!str) return getDateKey();
    const d=new Date(str.replace(/-/g,"/"));
    if(isNaN(d)) return getDateKey();
    return d.toISOString().split("T")[0];
}

function getDateKey(){
    return new Date().toISOString().split("T")[0];
}

/* ===== 添加 ===== */
function addRow(){
    const key=getDateKey();
    if(!data[key]) data[key]=[];

    currentDate=key;

    data[key].push({
        time:new Date().toLocaleString(),
        bp:"",
        hr:"",
        note:""
    });

    renderTabs();
    render();
}

/* ===== 标签 ===== */
function renderTabs(){
    const tabs=document.getElementById("tabs");
    tabs.innerHTML="";

    const keys=Object.keys(data).sort().reverse();
    const colors=["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7","#14b8a6"];

    keys.forEach((k,i)=>{
        const btn=document.createElement("button");

        const text=document.createElement("span");
        text.innerText=k;

        const del=document.createElement("span");
        del.innerText="×";
        del.className="delTab";

        del.onclick=(e)=>{
            e.stopPropagation();
            if(confirm("删除这一天所有记录？")){
                delete data[k];
                currentDate=Object.keys(data)[0]||getDateKey();
                renderTabs();
                render();
            }
        };

        btn.appendChild(text);
        btn.appendChild(del);

        if(k===currentDate){
            btn.style.background="#fff";
            btn.style.color="#000";
        }else{
            btn.style.background=colors[i%colors.length];
        }

        btn.onclick=()=>{
            currentDate=k;
            renderTabs();
            render();
        };

        tabs.appendChild(btn);
    });
}

/* ===== 血压判断 ===== */
function getBPColorParts(bp){
    if(!bp || !bp.includes("/")) return {sys:"#fff",dia:"#fff"};

    const [s,d]=bp.split("/").map(Number);

    return {
        sys:(s<110||s>135)?"#ef4444":"#22c55e",
        dia:(d<70||d>85)?"#ef4444":"#22c55e"
    };
}

/* ===== 心率 ===== */
function getHRColor(hr){
    const v=Number(hr);
    if(!v) return "#fff";
    return (v<60||v>100)?"#ef4444":"#22c55e";
}

/* ===== 渲染 ===== */
function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";

    const list=data[currentDate]||[];

    list.forEach((r,i)=>{
        const tr=document.createElement("tr");

        let bp=r.bp;
        if(bp && bp.includes("/")){
            const [s,d]=bp.split("/");
            const c=getBPColorParts(bp);
            bp=`<span style="color:${c.sys}">${s}</span>/<span style="color:${c.dia}">${d}</span>`;
        }

        tr.innerHTML=`
<td contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td contenteditable onblur="edit(${i},'bp',this.innerText)">${bp}</td>
<td contenteditable style="color:${getHRColor(r.hr)}" onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td><button onclick="delRow(${i})">删</button></td>
`;

        tbody.appendChild(tr);
    });

    document.getElementById("dayCount").innerText=list.length;

    document.getElementById("totalCount").innerText=
        Object.values(data).reduce((s,a)=>s+a.length,0);
}

/* ===== 编辑 ===== */
function edit(i,k,v){
    data[currentDate][i][k]=v.trim();
}

/* ===== 删除行 ===== */
function delRow(i){
    data[currentDate].splice(i,1);
    render();
}

/* ===== 导出 ===== */
function exportJSON(){
    const blob=new Blob([JSON.stringify(data,null,2)]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="data.json";
    a.click();
}

/* ===== 导入 ===== */
function importFile(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const reader=new FileReader();
        reader.onload=()=>{
            const parsed=JSON.parse(reader.result);

            data={};

            // ⭐关键：统一日期
            if(Array.isArray(parsed)){
                parsed.forEach(r=>{
                    const key=formatDate(r.time);
                    if(!data[key]) data[key]=[];
                    data[key].push(r);
                });
            }else{
                Object.keys(parsed).forEach(k=>{
                    const newKey=formatDate(k);
                    data[newKey]=parsed[k];
                });
            }

            currentDate=Object.keys(data)[0]||getDateKey();

            renderTabs();
            render();
        };

        reader.readAsText(e.target.files[0]);
    };

    input.click();
}

/* ===== 初始化 ===== */
renderTabs();
render();

</script>

</body>
</html>
