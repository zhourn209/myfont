<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:"Microsoft YaHei","PingFang SC";
    background:#020617;
    color:#fff;
    padding:12px;
}

.card{
    background:#111827;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}

input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}

button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
    font-weight:700;
}

.count{
    font-weight:700;
    margin-top:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:18px;
}
td,th{
    padding:12px;
    text-align:center;
    font-weight:700;
}

.ref{
    margin-top:8px;
    font-size:13px;
    color:#fde047;
}

@media (max-width:600px){
    table thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{
        background:#1f2937;
        margin-bottom:12px;
        border-radius:14px;
        padding:12px;
    }
}
</style>
</head>

<body>

<div class="card">
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">

<button onclick="saveConfig()">保存</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>

<div class="count">
总记录：<span id="totalCount">0</span> ｜ 当天：<span id="dayCount">0</span>
</div>
</div>

<div class="card">
<button onclick="addRow()">添加</button>

<div class="ref">
血压参考：正常&lt;120/&lt;80 ｜ 56–60岁：110-135 / 70-85<br>
心率60-100 ｜ 脉压差30-50
</div>
</div>

<div id="tabs"></div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th>
<th>血压</th>
<th>心率/脉压差</th>
<th>备注</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data={};
let currentDate=getDateKey();

function getDateKey(){
    return new Date().toISOString().split("T")[0];
}

/* 脉压差 */
function getPP(bp){
    if(!bp.includes("/")) return "";
    const [s,d]=bp.split("/").map(Number);
    return s-d;
}

function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";
    const list=data[currentDate]||[];

    list.forEach((r,i)=>{
        const pp=getPP(r.bp);

        tbody.innerHTML+=`
<tr>
<td contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td contenteditable onblur="edit(${i},'bp',this.innerText)">${r.bp}</td>
<td contenteditable onblur="edit(${i},'hr',this.innerText)">
${r.hr||''} / ${pp||''}
</td>
<td contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td><button onclick="del(${i})">删</button></td>
</tr>`;
    });

    document.getElementById("dayCount").innerText=list.length;
    document.getElementById("totalCount").innerText=Object.values(data).reduce((s,a)=>s+a.length,0);
}

function addRow(){
    const k=getDateKey();
    if(!data[k]) data[k]=[];
    currentDate=k;
    data[k].push({time:new Date().toLocaleString(),bp:"",hr:"",note:""});
    renderTabs();
    render();
}

function renderTabs(){
    const tabs=document.getElementById("tabs");
    tabs.innerHTML="";
    Object.keys(data).sort().reverse().forEach(k=>{
        const b=document.createElement("button");
        b.innerText=k;
        b.onclick=()=>{currentDate=k;renderTabs();render();};
        tabs.appendChild(b);
    });
}

function edit(i,k,v){
    data[currentDate][i][k]=v.trim();
}

function del(i){
    data[currentDate].splice(i,1);
    render();
}

/* 配置 */
function saveConfig(){
    localStorage.setItem("token",document.getElementById("token").value);
    localStorage.setItem("gist",document.getElementById("gist").value);
}

function loadConfig(){
    document.getElementById("token").value=localStorage.getItem("token")||"";
    document.getElementById("gist").value=localStorage.getItem("gist")||"";
}

/* 云 */
async function loadFromGist(){
    const res=await fetch(`https://api.github.com/gists/${document.getElementById("gist").value}`);
    const j=await res.json();
    data=JSON.parse(j.files["data.json"].content||"{}");
    renderTabs();
    render();
}

async function sync(){
    await fetch(`https://api.github.com/gists/${document.getElementById("gist").value}`,{
        method:"PATCH",
        headers:{Authorization:"token "+document.getElementById("token").value},
        body:JSON.stringify({
            files:{
                "data.json":{
                    content:JSON.stringify(data,null,2)
                }
            }
        })
    });
}

loadConfig();
</script>

</body>
</html>
