<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;

    /* ✅ 字体设置（已优化） */
    font-family:
    "Trebuchet MS",
    "Microsoft YaHei",
    "PingFang SC",
    "Segoe UI",
    sans-serif;

    background:#0f172a;
    color:#fff;
    padding:12px;
}

/* 状态提示 */
#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    display:none;
}
.success{background:#22c55e;}
.error{background:#ef4444;}

.card{
    background:#1e293b;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}

input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}

button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
}

/* 分级 */
.ref{
    font-size:16px;
    font-weight:800;
    color:#facc15;
    margin-top:6px;
}

/* 表格 */
table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    text-align:center;
}

/* 手机 */
@media (max-width:600px){
    table thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{background:#334155;margin-bottom:12px;border-radius:14px;padding:12px;}
    td{text-align:left;}
    td::before{content:attr(data-label);font-size:12px;color:#94a3b8;}
}
</style>
</head>

<body>

<div id="status"></div>

<div class="card">
<h3>GitHub 同步</h3>
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">

<button onclick="saveConfig()">保存</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>
</div>

<div class="card">
<button onclick="addRow()">添加</button>
<button onclick="exportCSV()">CSV</button>
<button onclick="exportJSON()">JSON</button>
<button onclick="importFile()">导入</button>

<div class="ref">
正常<120/<80 ｜ 正常高值120-139/80-89 ｜ 1级140-159/90-99 ｜ 2级≥160/≥100
</div>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th><th>血压</th><th>心率</th><th>备注</th><th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data=[];
let timer=null;

/* 提示 */
function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

/* 自动上传（核心） */
function autoSync(){
    clearTimeout(timer);
    timer=setTimeout(()=>{
        sync();
    },60000); // 60秒
}

/* 配置 */
function saveConfig(){
    localStorage.token=token.value;
    localStorage.gist=gist.value;
    show("已保存");
}

function loadConfig(){
    token.value=localStorage.token||"";
    gist.value=localStorage.gist||"";
}

/* 测试连接 */
async function testConnection(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`,{
            headers:{Authorization:"token "+token.value}
        });
        res.ok?show("连接成功"):show("连接失败","error");
    }catch{
        show("网络错误","error");
    }
}

/* 添加 */
function addRow(){
    data.push({
        time:new Date().toLocaleString(),
        bp:"",
        hr:"",
        note:""
    });
    render();
    autoSync();
}

/* 渲染 */
function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";

    data.forEach((r,i)=>{
        const tr=document.createElement("tr");

        tr.innerHTML=`
<td data-label="时间" contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td data-label="血压" contenteditable onblur="edit(${i},'bp',this.innerText)">${r.bp}</td>
<td data-label="心率" contenteditable onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td data-label="备注" contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td data-label="操作"><button onclick="del(${i})">删除</button></td>
`;
        tbody.appendChild(tr);
    });
}

/* 编辑 */
function edit(i,k,v){
    data[i][k]=v.trim();
    autoSync();
}

/* 删除 */
function del(i){
    data.splice(i,1);
    render();
    autoSync();
}

/* 上传 */
async function sync(){
    try{
        await fetch(`https://api.github.com/gists/${gist.value}`,{
            method:"PATCH",
            headers:{Authorization:"token "+token.value},
            body:JSON.stringify({
                files:{
                    "data.json":{
                        content:JSON.stringify(data,null,2)
                    }
                }
            })
        });
        show("自动已同步");
    }catch{
        show("上传失败","error");
    }
}

/* 下载（自动+兼容） */
async function loadFromGist(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`);
        if(!res.ok){return;}

        const j=await res.json();
        const content=j.files["data.json"]?.content;

        if(!content) return;

        const parsed=JSON.parse(content);

        if(Array.isArray(parsed)){
            data=parsed;
        }else if(parsed.data){
            data=parsed.data;
        }

        render();
    }catch{}
}

/* 导出 */
function exportCSV(){
    let csv="time,bp,hr,note\n";
    data.forEach(r=>{
        csv+=`${r.time},${r.bp},${r.hr},${r.note}\n`;
    });
    download(csv,"data.csv");
}

function exportJSON(){
    download(JSON.stringify(data,null,2),"data.json");
}

function download(c,n){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([c]));
    a.download=n;
    a.click();
}

/* 导入 */
function importFile(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();

        reader.onload=()=>{
            if(file.name.endsWith(".json")){
                data=JSON.parse(reader.result);
            }else{
                const lines=reader.result.split("\n").slice(1);
                data=lines.map(l=>{
                    const [t,bp,hr,n]=l.split(",");
                    return {time:t,bp,hr,note:n};
                });
            }
            render();
            autoSync();
            show("导入完成");
        };

        reader.readAsText(file);
    };

    input.click();
}

/* 初始化 */
loadConfig();
loadFromGist(); // ✅ 自动下载
</script>

</body>
</html>
