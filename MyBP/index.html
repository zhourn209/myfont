<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 圆润字体 -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:
    "Nunito",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;

    background:#0f172a;
    color:#fff;
    padding:12px;
}

/* 状态提示 */
#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    display:none;
    font-size:14px;
}
.success{background:#22c55e;}
.error{background:#ef4444;}

.card{
    background:#1e293b;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}

/* 输入框 */
input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
    font-size:14px;
}

/* 按钮 */
button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
    font-size:13px;
}

/* 工具栏 */
.toolbar{
    display:flex;
    flex-wrap:wrap;
}

/* 分级标签 */
.ref{
    margin-top:6px;
    font-size:13px;
    font-weight:700;
    color:#facc15;
    line-height:1.6;
}

/* 表格 */
table{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
}

td,th{
    padding:10px;
    text-align:center;
}

/* 手机卡片 */
@media (max-width:600px){

    table thead{display:none;}

    table,tbody,tr,td{
        display:block;
        width:100%;
    }

    tr{
        background:#334155;
        margin-bottom:12px;
        border-radius:14px;
        padding:12px;
    }

    td{
        text-align:left;
        padding:6px 0;
    }

    td::before{
        content:attr(data-label);
        display:block;
        font-size:12px;
        color:#94a3b8;
        margin-bottom:2px;
    }
}
</style>
</head>

<body>

<div id="status"></div>

<div class="card">
<h3>GitHub 同步</h3>
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">

<button onclick="saveConfig()">保存</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>
</div>

<div class="card toolbar">
<button onclick="addRow()">添加</button>
<button onclick="exportCSV()">CSV</button>
<button onclick="exportJSON()">JSON</button>
<button onclick="importFile()">导入</button>

<div class="ref">
正常 <120/<80 ｜ 正常高值 120-139/80-89<br>
1级高血压 140-159/90-99 ｜ 2级高血压 ≥160/≥100
</div>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th>
<th>血压</th>
<th>心率</th>
<th>备注</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data=[];

/* 提示 */
function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

/* 配置 */
function saveConfig(){
    localStorage.token=token.value;
    localStorage.gist=gist.value;
    show("已保存");
}

function loadConfig(){
    token.value=localStorage.token||"";
    gist.value=localStorage.gist||"";
}

/* 测试连接 */
async function testConnection(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`,{
            headers:{Authorization:"token "+token.value}
        });
        res.ok?show("连接成功"):show("连接失败","error");
    }catch{
        show("网络错误","error");
    }
}

/* 添加 */
function addRow(){
    data.push({
        time:new Date().toLocaleString(),
        bp:"",
        hr:"",
        note:""
    });
    render();
}

/* 渲染 */
function render(){
    const tbody=document.getElementById("tbody");
    tbody.innerHTML="";

    data.forEach((r,i)=>{
        const tr=document.createElement("tr");

        tr.innerHTML=`
<td data-label="时间" contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td data-label="血压" contenteditable onblur="edit(${i},'bp',this.innerText)">${r.bp}</td>
<td data-label="心率" contenteditable onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td data-label="备注" contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td data-label="操作"><button onclick="del(${i})">删除</button></td>
`;
        tbody.appendChild(tr);
    });
}

/* 编辑 */
function edit(i,k,v){
    data[i][k]=v.trim();
}

/* 删除 */
function del(i){
    data.splice(i,1);
    render();
}

/* 上传 */
async function sync(){
    try{
        await fetch(`https://api.github.com/gists/${gist.value}`,{
            method:"PATCH",
            headers:{Authorization:"token "+token.value},
            body:JSON.stringify({
                files:{
                    "data.json":{
                        content:JSON.stringify(data,null,2)
                    }
                }
            })
        });
        show("更新完成");
    }catch{
        show("上传失败","error");
    }
}

/* 下载（安全） */
async function loadFromGist(){
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`);
        if(!res.ok){show("下载失败","error");return;}

        const j=await res.json();
        const content=j.files["data.json"]?.content;

        if(!content){
            show("远程无数据","error");
            return;
        }

        const parsed=JSON.parse(content);
        if(!Array.isArray(parsed)){
            show("格式错误","error");
            return;
        }

        data=parsed;
        render();
        show("更新完成");
    }catch{
        show("下载失败","error");
    }
}

/* 导出 */
function exportCSV(){
    let csv="time,bp,hr,note\n";
    data.forEach(r=>{
        csv+=`${r.time},${r.bp},${r.hr},${r.note}\n`;
    });
    download(csv,"data.csv");
}

function exportJSON(){
    download(JSON.stringify(data,null,2),"data.json");
}

function download(c,n){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([c]));
    a.download=n;
    a.click();
}

/* 导入 */
function importFile(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();

        reader.onload=()=>{
            if(file.name.endsWith(".json")){
                data=JSON.parse(reader.result);
            }else{
                const lines=reader.result.split("\n").slice(1);
                data=lines.map(l=>{
                    const [t,bp,hr,n]=l.split(",");
                    return {time:t,bp,hr,note:n};
                });
            }
            render();
            show("导入完成");
        };

        reader.readAsText(file);
    };

    input.click();
}

loadConfig();
render();
</script>

</body>
</html>
