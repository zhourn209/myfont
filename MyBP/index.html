<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>血压记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:"Trebuchet MS","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    background:#0f172a;
    color:#fff;
    padding:12px;
}
#status{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    display:none;
}
.success{background:#22c55e;}
.error{background:#ef4444;}
.card{
    background:#1e293b;
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
}
input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:none;
}
button{
    padding:8px 14px;
    margin:4px;
    border:none;
    border-radius:999px;
    background:#22c55e;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}
.count{
    font-size:15px;
    font-weight:700;
    color:#cbd5f5;
}
.toolbar{
    display:flex;
    flex-wrap:wrap;
}
.ref{
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    color:#facc15;
    line-height:1.6;
}
table{
    width:100%;
    border-collapse:collapse;
    font-size:15px;
}
td,th{
    padding:10px;
    text-align:center;
}
#tabs{
    display:flex;
    flex-wrap:wrap;
    margin-bottom:10px;
}
#tabs button{
    cursor:pointer;
}
@media (max-width:600px){
    table thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{
        background:#334155;
        margin-bottom:12px;
        border-radius:14px;
        padding:12px;
    }
    td{text-align:left;}
}
</style>
</head>

<body>
<div id="status"></div>

<div class="card">
<div class="topbar">
<div>
<input id="token" placeholder="Token">
<input id="gist" placeholder="Gist ID">
<button onclick="saveConfig()">保存</button>
<button onclick="testConnection()">测试连接</button>
<button onclick="loadFromGist()">下载</button>
<button onclick="sync()">上传</button>
</div>
<div class="count">
总记录：<span id="totalCount">0</span> ｜ 当天：<span id="dayCount">0</span>
</div>
</div>
</div>

<div class="card toolbar">
<button onclick="addRow()">添加</button>
<button onclick="exportCSV()">CSV</button>
<button onclick="exportJSON()">JSON</button>
<button onclick="importFile()">导入</button>
<div class="ref">
正常&lt;120/&lt;80 ｜ 正常高值120-139/80-89 ｜ 1级140-159/90-99 ｜ 2级≥160/≥100<br>
56–60岁建议：收缩压110-135 / 舒张压70-85 ｜ 心率60-100<br>
双臂差&lt;10正常 ｜ 10-15轻度 ｜ ≥15需关注
</div>
</div>

<div id="tabs"></div>

<div class="card">
<table>
<thead>
<tr>
<th>时间</th>
<th>血压</th>
<th>心率</th>
<th>备注</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let data = {};
let currentDate = getDateKey();
let timer=null;

function getDateKey(){
    const d=new Date();
    const yyyy=d.getFullYear();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
}
function formatDateKey(dateStr){
    const d=new Date(dateStr.replace(/\//g,'-'));
    if(isNaN(d)) return getDateKey();
    const yyyy=d.getFullYear();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
}

function getBPColorParts(bp){
    if(!bp || !bp.includes("/")) return {sys:"#fff", dia:"#fff"};
    const [sys,dia]=bp.split("/").map(Number);
    return {sys:(sys<110||sys>135)?"#ef4444":"#22c55e",dia:(dia<70||dia>85)?"#ef4444":"#22c55e"};
}

function getHRColor(hr){
    const v=Number(hr);
    if(!v) return "#fff";
    return (v<60||v>100)?"#ef4444":"#22c55e";
}

function show(msg,type="success"){
    const el=document.getElementById("status");
    el.innerText=msg;
    el.className=type;
    el.style.display="block";
    setTimeout(()=>el.style.display="none",2000);
}

function autoSync(){ clearTimeout(timer); timer=setTimeout(()=>{ sync(); },60000); }
function saveConfig(){ localStorage.token=token.value; localStorage.gist=gist.value; show("已保存"); }
function loadConfig(){ token.value=localStorage.token||""; gist.value=localStorage.gist||""; }

function addRow(){
    const key=getDateKey();
    if(!data[key]) data[key]=[];
    currentDate=key;
    data[key].push({time:new Date().toLocaleString(),bp:"",hr:"",note:""});
    renderTabs(); render(); autoSync();
}

function renderTabs(){
    const tabs=document.getElementById("tabs"); tabs.innerHTML="";
    const keys=Object.keys(data).sort().reverse();
    const colors=["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7","#14b8a6"];
    keys.forEach((k,i)=>{
        const btn=document.createElement("button");
        btn.style.marginRight="6px";
        btn.innerHTML=k+' <span style="color:red;cursor:pointer" onclick="deleteDate(event,\''+k+'\')">×</span>';
        if(k===currentDate){ btn.style.background="#ffffff"; btn.style.color="#000"; }
        else{ btn.style.background=colors[i%colors.length]; }
        btn.onclick=(e)=>{ if(e.target.tagName.toLowerCase()==='span') return; currentDate=k; renderTabs(); render(); };
        tabs.appendChild(btn);
    });
}

function deleteDate(e,date){ e.stopPropagation(); if(confirm(`删除 ${date} 的所有记录？`)){ delete data[date]; const keys=Object.keys(data).sort().reverse(); currentDate=keys[0]||getDateKey(); renderTabs(); render(); autoSync(); } }

function render(){
    const tbody=document.getElementById("tbody"); tbody.innerHTML="";
    const list=data[currentDate]||[];
    list.forEach((r,i)=>{
        let bpHtml=r.bp;
        if(r.bp&&r.bp.includes("/")){
            const [sys,dia]=r.bp.split("/");
            const c=getBPColorParts(r.bp);
            bpHtml=`<span style="color:${c.sys}">${sys}</span>/<span style="color:${c.dia}">${dia}</span>`;
        }
        const tr=document.createElement("tr");
        tr.innerHTML=`
<td contenteditable onblur="edit(${i},'time',this.innerText)">${r.time}</td>
<td contenteditable onblur="edit(${i},'bp',this.innerText)">${bpHtml}</td>
<td contenteditable style="color:${getHRColor(r.hr)}" onblur="edit(${i},'hr',this.innerText)">${r.hr}</td>
<td contenteditable onblur="edit(${i},'note',this.innerText)">${r.note}</td>
<td><button onclick="del(${i})">删除</button></td>`;
        tbody.appendChild(tr);
    });
    document.getElementById("dayCount").innerText=list.length;
    document.getElementById("totalCount").innerText=Object.values(data).reduce((s,a)=>s+a.length,0);
}

function edit(i,k,v){ data[currentDate][i][k]=v.trim(); autoSync(); }
function del(i){ data[currentDate].splice(i,1); render(); autoSync(); }

async function testConnection(){
    show("正在测试连接…");
    try{ const res=await fetch(`https://api.github.com/gists/${gist.value}`,{headers:{Authorization:"token "+token.value}}); if(res.ok) show("连接成功"); else show("连接失败","error"); }catch{ show("连接失败","error"); }
}

function addDataWithDedup(newData){
    for(const key in newData){
        const fKey=formatDateKey(key);
        if(!data[fKey]) data[fKey]=[];
        newData[key].forEach(r=>{
            const exists = data[fKey].some(e => e.time===r.time && e.bp===r.bp && e.hr===r.hr && e.note===r.note);
            if(!exists) data[fKey].push(r);
        });
    }
}

async function loadFromGist(){
    show("正在下载…");
    try{
        const res=await fetch(`https://api.github.com/gists/${gist.value}`,{headers:{Authorization:"token "+token.value}});
        if(!res.ok) throw new Error("下载失败");
        const j=await res.json();
        const content=j.files["data.json"]?.content;
        if(!content) throw new Error("数据为空");
        const parsed=JSON.parse(content);
        let newData={};
        if(Array.isArray(parsed)){ parsed.forEach(r=>{ const key=r.time?formatDateKey(r.time.split(" ")[0]):getDateKey(); if(!newData[key]) newData[key]=[]; newData[key].push(r); }); }
        else{ for(const key in parsed){ const fKey=formatDateKey(key); newData[fKey]=parsed[key]; } }
        addDataWithDedup(newData);
        currentDate=Object.keys(data).sort().reverse()[0]||getDateKey();
        renderTabs(); render();
        show("下载成功");
    }catch(e){ console.error(e); show("下载失败","error"); }
}

async function sync(){
    show("正在上传…");
    try{ await fetch(`https://api.github.com/gists/${gist.value}`,{method:"PATCH",headers:{Authorization:"token "+token.value},body:JSON.stringify({files:{"data.json":{content:JSON.stringify(data,null,2)}}})}); show("上传成功"); }
    catch(e){ console.error(e); show("上传失败","error"); }
}

function exportCSV(){
    let csv="时间,血压,心率,备注\n";
    for(const key in data){ data[key].forEach(r=>{ csv+=`"${r.time}","${r.bp}","${r.hr}","${r.note}"\n`; }); }
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="blood_pressure.csv"; a.click();
    URL.revokeObjectURL(url);
    show("CSV 导出成功");
}

function exportJSON(){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="blood_pressure.json"; a.click();
    URL.revokeObjectURL(url);
    show("JSON 导出成功");
}

function importFile(){
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json,.csv";
    input.onchange=async ()=>{
        const file=input.files[0];
        if(!file) return;
        const text=await file.text();
        let newData={};
        if(file.name.endsWith(".json")){
            try{ const parsed=JSON.parse(text);
                if(Array.isArray(parsed)){ parsed.forEach(r=>{ const key=r.time?formatDateKey(r.time.split(" ")[0]):getDateKey(); if(!newData[key]) newData[key]=[]; newData[key].push(r); }); }
                else{ for(const key in parsed){ const fKey=formatDateKey(key); newData[fKey]=parsed[key]; } }
                addDataWithDedup(newData);
                currentDate=Object.keys(data).sort().reverse()[0]||getDateKey();
                renderTabs(); render();
                show("JSON 导入成功");
            }catch(e){ console.error(e); show("导入失败","error"); }
        }else if(file.name.endsWith(".csv")){
            const lines=text.split(/\r?\n/).slice(1);
            lines.forEach(line=>{
                if(!line.trim()) return;
                const [time,bp,hr,note]=line.split(",").map(s=>s.replace(/^"|"$/g,''));
                const key=time?formatDateKey(time.split(" ")[0]):getDateKey();
                if(!newData[key]) newData[key]=[];
                newData[key].push({time,bp,hr,note});
            });
            addDataWithDedup(newData);
            currentDate=Object.keys(data).sort().reverse()[0]||getDateKey();
            renderTabs(); render();
            show("CSV 导入成功");
        }else show("不支持的文件格式","error");
    };
    input.click();
}

/* 初始化 */
loadConfig();
loadFromGist();
renderTabs();
render();
</script>

</body>
</html>
